<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCA·AI — Scheduled Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #F8FAFA;
            color: #0E2E27;
            text-align: center;
            padding: 24px;
        }
        .container { max-width: 520px; }
        .icon {
            width: 80px; height: 80px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #14C997 0%, #0FB386 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 12px 32px -4px rgba(20,201,151,0.35);
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #0E2E27;
        }
        p {
            font-size: 16px;
            line-height: 1.7;
            color: #4D5E61;
            margin-bottom: 24px;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #93A0A6;
        }
        .brand .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #14C997;
            display: inline-block;
        }
        .loader-dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 32px;
        }
        .loader-dots span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #14C997;
            opacity: 0.3;
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
            40% { opacity: 1; transform: scale(1.3); }
        }
        @media (max-width: 480px) {
            h1 { font-size: 22px; }
            p { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>
        <h1>Scheduled Maintenance</h1>
        <p>The system is temporarily unavailable for maintenance.<br>We'll be back soon!</p>
        <div class="loader-dots">
            <span></span><span></span><span></span>
        </div>
        <div style="margin-top:48px">
            <span class="brand"><span class="dot"></span>LCA·AI</span>
        </div>
    </div>
</body>
</html>
