<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function(){
      var t = localStorage.getItem('lca-theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.background = '#0F1F1B';
      }
    })();
    </script>
    <title>LCA·AI — Вход</title>
    <script>document.title = {ru:'LCA·AI — Вход',en:'LCA·AI — Sign In',zh:'LCA·AI — 登录'}[localStorage.getItem('lca-lang')||'ru'];</script>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #FFFFFF; --bg-soft: #F8FAFA; --ink: #0E2E27; --ink-soft: #4D5E61; --ink-mute: #93A0A6; --jade: #14C997; --jade-dark: #0FB386; --jade-bg: #ECFAF4; --rule: #E5E8EB; --c-rust: #C25450; }
        html.dark { --bg: #0F1F1B; --bg-soft: #162B26; --ink: #E8F0ED; --ink-soft: #A0B0AA; --ink-mute: #6B7D78; --jade-bg: #1A332D; --rule: #2A3F39; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Manrope', system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
        .login-card { background: var(--bg); border: 1px solid var(--rule); border-radius: 20px; padding: 48px 40px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 20px 40px -12px rgba(14,46,39,0.1); }
        .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
        .brand .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--jade); display: inline-flex; align-items: center; justify-content: center; }
        .brand .dot::after { content: ''; width: 11px; height: 11px; background: white; border-radius: 50%; }
        .subtitle { font-size: 14px; color: var(--ink-mute); margin-bottom: 32px; }
        .form-group { display: flex; flex-direction: column; gap: 12px; text-align: left; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: -8px; }
        .form-group input { padding: 12px 16px; border: 1px solid var(--rule); border-radius: 10px; font-family: inherit; font-size: 14px; color: var(--ink); background: var(--bg-soft); outline: none; transition: border-color .15s; }
        .form-group input:focus { border-color: var(--jade); }
        .submit-btn { background: var(--jade); color: white; border: none; padding: 12px; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; width: 100%; margin-top: 8px; }
        .submit-btn:hover { background: var(--jade-dark); }
        .submit-btn:disabled { opacity: .5; cursor: not-allowed; }
        .switch-mode { margin-top: 20px; font-size: 13px; color: var(--ink-mute); }
        .switch-mode a { color: var(--jade); cursor: pointer; font-weight: 600; text-decoration: none; }
        .switch-mode a:hover { text-decoration: underline; }
        .msg { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 13px; display: none; }
        .msg.success { display: block; background: var(--jade-bg); color: var(--jade-dark); border: 1px solid var(--jade-bg); }
        .msg.error { display: block; background: #FEF1EE; color: var(--c-rust); border: 1px solid #FEF1EE; }
        .footer { margin-top: 24px; font-size: 12px; color: var(--ink-mute); }
        .footer a { color: var(--jade); text-decoration: none; }
        .header-bar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; }
        .theme-toggle { background: none; border: 1px solid var(--rule); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; transition: all .15s; padding: 0; }
        .theme-toggle:hover { border-color: var(--jade); background: var(--jade-bg); }
        .lang-switch { display: inline-flex; background: var(--bg-soft); border-radius: 30px; padding: 3px; border: 1px solid var(--rule); }
        .lang-switch button { background: none; border: none; padding: 5px 10px; border-radius: 30px; font-size: 11px; font-weight: 600; color: var(--ink-mute); cursor: pointer; transition: all .15s; }
        .lang-switch button.active { background: white; color: var(--ink); box-shadow: 0 1px 4px rgba(14,46,39,0.08); }
        .divider { display: flex; align-items: center; margin: 20px 0; color: var(--ink-mute); font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
        .divider span { padding: 0 12px; }
        .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border: 1px solid var(--rule); border-radius: 10px; background: white; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; transition: all .15s; margin-top: 10px; }
        .google-btn:hover { border-color: var(--jade); background: var(--jade-bg); }
        .oauth-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; transition: all .15s; margin-top: 10px; }
        .oauth-btn:hover { border-color: var(--jade); background: var(--jade-bg); }
        html.dark .google-btn,
        html.dark .submit-btn,
        html.dark button {
          background: var(--bg-soft);
          color: var(--ink);
          border: 1px solid var(--rule);
        }
        html.dark .google-btn:hover,
        html.dark button:hover {
          background: var(--jade-bg);
          border-color: var(--jade);
        }
        html.dark .submit-btn {
          background: var(--jade);
          color: #fff;
          border: none;
        }
        html.dark .submit-btn:hover {
          background: var(--jade-dark);
        }
        html.dark .lang-switch button.active {
          background: var(--jade-bg);
          color: var(--ink);
          box-shadow: none;
        }
        html.dark .oauth-btn { background: var(--bg-soft); color: var(--ink); border-color: var(--rule); }
        html.dark .oauth-btn:hover { background: var(--jade-bg); border-color: var(--jade); }
        html.dark .theme-toggle {
          color: var(--ink);
        }
        html.dark .msg.error {
          background: #2a1a18;
          color: #e8908a;
          border-color: #3d2020;
        }
        @media (max-width: 480px) { .login-card { padding: 32px 24px; } }
    </style>
</head>

                title: 'LCA·AI — 登录', subtitle: '登录以访问计算',
                google_btn: '使用 Google 继续', github_btn: 'GitHub', twitter_btn: 'X / Twitter',
                or: '或',
                email_label: '邮箱', email_ph: '请输入邮箱',
                password_label: '密码', password_ph: '请输入密码',
                login_btn: '登录', confirm_password: '确认密码',
                min6_ph: '至少6个字符', confirm_ph: '再次输入密码',
                reg_btn: '注册',
                otp_title: '使用邮箱验证码登录', send_code: '发送验证码',
                code_ph: '邮箱验证码', verify_btn: '登录',
                otp_toggle: '使用邮箱验证码登录',
                no_account: '没有账户？', register: '注册',
                has_account: '已有账户？', login_link: '登录',
                agreement: '登录即表示您同意', terms: '服务条款',
                wechat_label: '微信（即将上线）', wechat_alert: '微信登录将在配置微信开放平台后可用',
                discord_alert: 'Discord OAuth将在Discord Developer Portal配置后可用',
                wallet_install: '安装MetaMask或其他Web3钱包以登录',
                wallet_connect: '钱包已连接',
                wallet_fail: '钱包连接失败',
                sb_not_loaded: 'Supabase 未加载', sb_sdk_missing: 'Supabase SDK 未加载',
                logging_in: '登录中...', passwords_mismatch: '密码不匹配',
                min6_chars: '密码至少需要6个字符',
                registering: '注册中...',
                confirmation_sent: '确认邮件已发送至',
                account_created: '账户已创建！请登录。',
                code_sent: '验证码已发送至',
                back_to_login: '使用账号登录'
            }
        };
        let loginLang = 'ru';
        function loginT(key) { return LOGIN_I18N[loginLang]?.[key] || LOGIN_I18N.ru[key] || key; }

        function initSupabase() { if (window.supabase) { sbClient = window.supabase.createClient(SB_URL, SB_KEY); return true; } showError(loginT('sb_sdk_missing')); return false; }

        async function checkSession() {
            if (!sbClient) return;
            const { data: { session } } = await sbClient.auth.getSession();
            if (session) {
                window.location.href = REDIRECT;
            }
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('loginForm').style.display = isLoginMode ? 'flex' : 'none';
            document.getElementById('registerForm').style.display = isLoginMode ? 'none' : 'flex';
            document.getElementById('switchText').textContent = isLoginMode ? loginT('no_account') : loginT('has_account');
            document.getElementById('switchLink').textContent = isLoginMode ? loginT('register') : loginT('login_link');
            document.getElementById('subtitle').textContent = loginT('subtitle');
            hideMsg();
        }

        document.getElementById('googleBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            try {
                const { error } = await sbClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: REDIRECT } });
                if (error) showError(translateError(error.message));
            } catch (err) { showError(translateError(err.message)); }
        });

        // NOTE: Requires GitHub provider enabled in Supabase Dashboard → Authentication → Providers
        document.getElementById('githubBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            try {
                const { error } = await sbClient.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: REDIRECT } });
                if (error) showError(translateError(error.message));
            } catch (err) { showError(translateError(err.message)); }
        });

        // Supabase uses 'twitter' as the provider name (not 'x')
        document.getElementById('twitterBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            try {
                const { error } = await sbClient.auth.signInWithOAuth({ provider: 'x', options: { redirectTo: REDIRECT } });
                if (error) showError(translateError(error.message));
            } catch (err) { showError(translateError(err.message)); }
        });

        document.getElementById('wechatBtn').addEventListener('click', () => {
            alert(loginT('wechat_alert'));
        });

        // Discord OAuth via Supabase
        document.getElementById('discordBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            try {
                await sbClient.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: REDIRECT } });
            } catch (e) { showError('Discord: ' + e.message); }
        });

        // Web3 Wallet via MetaMask
        document.getElementById('walletBtn').addEventListener('click', async () => {
            if (!window.ethereum) {
                alert(loginT('wallet_install'));
                return;
            }
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const address = accounts[0];
                const message = 'Sign in to LCA-AI\nWallet: ' + address + '\nTime: ' + Date.now();
                const signature = await window.ethereum.request({
                    method: 'personal_sign',
                    params: [message, address]
                });
                // Send to Supabase Edge Function for verification
                const resp = await fetch(SB_URL + '/functions/v1/web3-auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + SB_KEY
                    },
                    body: JSON.stringify({ address, message, signature })
                });
                const data = await resp.json();
                if (data.error) { showError('Web3: ' + data.error); return; }
                // Save session and redirect
                localStorage.setItem('supabase_token', data.access_token);
                window.location.href = REDIRECT;
            } catch (e) {
                if (e.code === 4001) return; // User rejected
                showError(loginT('wallet_fail') + ': ' + e.message);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = loginT('logging_in');
            try {
                const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
                btn.disabled = false; btn.textContent = loginT('login_btn');
                if (error) showError(translateError(error.message));
                else { window.location.href = REDIRECT; }
            } catch (err) { btn.disabled = false; btn.textContent = loginT('login_btn'); showError(translateError(err.message)); }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            if (password !== passwordConfirm) { showError(loginT('passwords_mismatch')); return; }
            if (password.length < 6) { showError(loginT('min6_chars')); return; }
            const btn = document.getElementById('regBtn');
            btn.disabled = true; btn.textContent = loginT('registering');
            try {
                const { data, error } = await sbClient.auth.signUp({ email, password });
                btn.disabled = false; btn.textContent = loginT('reg_btn');
                if (error) showError(translateError(error.message));
                else if (data.user && data.session) { window.location.href = REDIRECT; }
                else if (data.user && !data.session) { showSuccess(loginT('confirmation_sent') + ' ' + email); toggleMode(); }
                else { showSuccess(loginT('account_created')); toggleMode(); }
            } catch (err) { btn.disabled = false; btn.textContent = loginT('reg_btn'); showError(translateError(err.message)); }
        });

        function translateError(msg) {
            const errors = {
                'Invalid login credentials': { ru: 'Неверный логин или пароль', en: 'Invalid login credentials', zh: '登录凭证无效' },
                'Email not confirmed': { ru: 'Email не подтверждён', en: 'Email not confirmed', zh: '邮箱未确认' },
                'User already registered': { ru: 'Пользователь уже зарегистрирован', en: 'User already registered', zh: '用户已注册' },
                'Invalid email': { ru: 'Некорректный email', en: 'Invalid email', zh: '无效的邮箱' },
                'Password should be at least 6 characters': { ru: 'Пароль должен содержать минимум 6 символов', en: 'Password should be at least 6 characters', zh: '密码至少需要6个字符' },
                'Unable to validate email address: invalid format': { ru: 'Некорректный формат email', en: 'Unable to validate email address: invalid format', zh: '无法验证邮箱地址：格式无效' },
                'Signup is disabled': { ru: 'Регистрация отключена', en: 'Signup is disabled', zh: '注册已关闭' },
                'Email link is invalid or has expired': { ru: 'Ссылка недействительна или истекла', en: 'Email link is invalid or has expired', zh: '链接无效或已过期' },
                'Token has expired or is invalid': { ru: 'Токен истёк или недействителен', en: 'Token has expired or is invalid', zh: '令牌已过期或无效' },
                'For security purposes, you can only request this once every 60 seconds': { ru: 'По соображениям безопасности повторный запрос разрешён раз в 60 секунд', en: 'For security purposes, you can only request this once every 60 seconds', zh: '出于安全考虑，每60秒只能请求一次' },
                'To login please use the link that was sent to your email': { ru: 'Для входа перейдите по ссылке из письма', en: 'To login please use the link that was sent to your email', zh: '请使用发送到您邮箱的链接登录' }
            };
            for (const [key, translations] of Object.entries(errors)) {
                if (msg.includes(key)) return translations[loginLang] || translations.en;
            }
            return msg;
        }
        function showError(msg) { const el = document.getElementById('msg'); el.className = 'msg error'; el.textContent = msg; }
        function showSuccess(msg) { const el = document.getElementById('msg'); el.className = 'msg success'; el.textContent = msg; }
        function hideMsg() { const el = document.getElementById('msg'); el.className = 'msg'; el.textContent = ''; }

        (function() {
            const saved = localStorage.getItem('lca-theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
            const btn = document.getElementById('themeToggle');
            if (btn) { btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙'; btn.addEventListener('click', () => { document.documentElement.classList.toggle('dark'); btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙'; localStorage.setItem('lca-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); }); }
        })();

        (function() {
            const saved = localStorage.getItem('lca-lang');
            const browserLang = (navigator.language || '').toLowerCase();
            const lang = saved || (browserLang.startsWith('ru') ? 'ru' : browserLang.startsWith('en') ? 'en' : 'ru');
            document.querySelectorAll('.lang-switch button').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
                b.addEventListener('click', () => { document.querySelectorAll('.lang-switch button').forEach(x => x.classList.remove('active')); b.classList.add('active'); localStorage.setItem('lca-lang', b.dataset.lang); applyLoginLang(b.dataset.lang); });
            });
            applyLoginLang(lang);
        })();

        function applyLoginLang(lang) {
            loginLang = lang;
            const t = LOGIN_I18N[lang] || LOGIN_I18N.ru;
            document.title = t.title;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.dataset.i18nPlaceholder;
                if (t[key]) el.placeholder = t[key];
            });
            document.getElementById('loginBtn').textContent = t.login_btn;
            document.getElementById('regBtn').textContent = t.reg_btn;
            document.getElementById('switchText').textContent = isLoginMode ? t.no_account : t.has_account;
            document.getElementById('switchLink').textContent = isLoginMode ? t.register : t.login_link;
        }

        document.getElementById('toggleOtp').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('switchMode').style.display = 'none';
            document.getElementById('toggleOtpWrap').style.display = 'none';
            document.getElementById('otpSection').style.display = 'block';
            document.getElementById('otpEmail').value = document.getElementById('loginEmail').value;
            hideMsg();
        });

        document.getElementById('backToLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('otpSection').style.display = 'none';
            document.getElementById('loginForm').style.display = 'flex';
            document.getElementById('switchMode').style.display = '';
            document.getElementById('toggleOtpWrap').style.display = '';
            hideMsg();
        });

        document.getElementById('sendOtpBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            const email = document.getElementById('otpEmail').value;
            if (!email) return;
            const { error } = await sbClient.auth.signInWithOtp({ email });
            if (error) { showError(translateError(error.message)); return; }
            showSuccess(loginT('code_sent') + ' ' + email);
            document.getElementById('otpCodeSection').style.display = 'block';
        });

        document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            const email = document.getElementById('otpEmail').value;
            const token = document.getElementById('otpCode').value;
            const { error } = await sbClient.auth.verifyOtp({ email, token, type: 'email' });
            if (error) { showError(translateError(error.message)); return; }
            window.location.href = '/';
        });

        window.addEventListener('load', () => { if (initSupabase()) checkSession(); });
    </script>
</body>
</html>
