<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCA·AI — Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFFFFF;
            --bg-soft: #F8FAFA;
            --ink: #0E2E27;
            --ink-soft: #4D5E61;
            --ink-mute: #93A0A6;
            --jade: #14C997;
            --jade-dark: #0FB386;
            --jade-bg: #ECFAF4;
            --rule: #E5E8EB;
            --c-rust: #C25450;
        }
        html.dark {
            --bg: #0F1F1B;
            --bg-soft: #162B26;
            --ink: #E8F0ED;
            --ink-soft: #A0B0AA;
            --ink-mute: #6B7D78;
            --jade-bg: #1A332D;
            --rule: #2A3F39;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .login-card {
            background: var(--bg);
            border: 1px solid var(--rule);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px -12px rgba(14,46,39,0.1);
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .brand .dot {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--jade);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .brand .dot::after {
            content: '';
            width: 11px; height: 11px;
            background: white;
            border-radius: 50%;
        }
        .subtitle {
            font-size: 14px;
            color: var(--ink-mute);
            margin-bottom: 32px;
        }
        .email-form { display: flex; flex-direction: column; gap: 12px; }
        .email-input {
            padding: 12px 16px;
            border: 1px solid var(--rule);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            color: var(--ink);
            background: var(--bg-soft);
            outline: none;
            transition: border-color .15s;
        }
        .email-input:focus { border-color: var(--jade); }
        .email-btn {
            background: var(--jade);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
        }
        .email-btn:hover { background: var(--jade-dark); }
        .email-btn:disabled { opacity: .5; cursor: not-allowed; }
        .msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .msg.success { display: block; background: var(--jade-bg); color: var(--jade-dark); border: 1px solid var(--jade-bg); }
        .msg.error { display: block; background: #FEF1EE; color: var(--c-rust); border: 1px solid #FEF1EE; }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: var(--ink-mute);
        }
        .footer a { color: var(--jade); text-decoration: none; }
        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <span class="dot"></span>
            LCA·AI
        </div>
        <p class="subtitle">Войдите для доступа к расчётам</p>

        <form class="email-form" id="emailForm">
            <input type="email" class="email-input" id="emailInput" placeholder="Введите email" required>
            <button type="submit" class="email-btn" id="emailBtn">Отправить ссылку</button>
        </form>

        <div class="msg" id="msg"></div>

        <p class="footer">
            Нажимая «Войти», вы соглашаетесь с <a href="#">условиями использования</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pbisngkepszwzzjivxus.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBiaXNuZ2tlcHN6d3p6aml2eHVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NDQzMjQsImV4cCI6MjA5OTAyMDMyNH0.RV7GaTA7Wo2JIPMChh8j4ro7eXqZA9g_vCOnfjJ1bJY';

        let sbClient = null;
        const REDIRECT_TO = window.location.origin + '/';

        function initSupabase() {
            if (window.supabase) {
                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return true;
            }
            showError('Supabase SDK не загружен');
            return false;
        }

        async function checkSession() {
            if (!sbClient) return;
            const { data: { session } } = await sbClient.auth.getSession();
            if (session) {
                localStorage.setItem('supabase_user', JSON.stringify(session.user));
                localStorage.setItem('supabase_token', session.access_token);
                window.location.href = REDIRECT_TO;
            }
        }

        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!sbClient) { showError('Supabase не загружен'); return; }
            const email = document.getElementById('emailInput').value;
            const btn = document.getElementById('emailBtn');
            btn.disabled = true;
            btn.textContent = 'Отправка...';

            try {
                const { data, error } = await sbClient.auth.signInWithOtp({
                    email: email,
                    options: { emailRedirectTo: REDIRECT_TO }
                });
                btn.disabled = false;
                btn.textContent = 'Отправить ссылку';
                if (error) {
                    showError(error.message);
                } else {
                    showSuccess('Ссылка для входа отправлена на ' + email);
                    document.getElementById('emailForm').style.display = 'none';
                }
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Отправить ссылку';
                showError('Ошибка: ' + err.message);
            }
        });

        function showError(msg) {
            const el = document.getElementById('msg');
            el.className = 'msg error';
            el.textContent = msg;
        }

        function showSuccess(msg) {
            const el = document.getElementById('msg');
            el.className = 'msg success';
            el.textContent = msg;
        }

        window.addEventListener('load', () => {
            if (initSupabase()) {
                checkSession();
            }
        });
    </script>
</body>
</html>
