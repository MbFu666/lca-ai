        document.documentElement.classList.add('dark');
        document.documentElement.style.background = '#131211';
      }
    })();

    <style>
:root {
  --bg: #F2F0EC; --bg-soft: #E9E6E0; --ink: #1C1B19; --ink-soft: #6B6862; --ink-mute: #9B978F;
  --jade: #D9481C; --jade-dark: #F03B0C; --jade-bg: #E9E6E0; --rule: #D6D2CB; --c-rust: #A32E12;
  --display: 'Oswald', 'Noto Sans SC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
html.dark {
  --bg: #131211; --bg-soft: #1B1A18; --ink: #EDEAE4; --ink-soft: #9B978F; --ink-mute: #6B6862;
  --jade: #F05A23; --jade-dark: #FF6B2C; --jade-bg: #1B1A18; --rule: #2E2C29;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Source Serif 4', 'Noto Sans SC', Georgia, serif;
  background: var(--bg); color: var(--ink);
  display: flex; justify-content: center; align-items: center;
  min-height: 100dvh; padding: 24px;
}
/* Drafting grid, same substrate as the rest of the site */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 8px 8px; opacity: 0.35;
}
html.dark body::before { opacity: 0.2; }

.login-card {
  position: relative; z-index: 1;
  background: var(--bg); border: 1px solid var(--ink); border-radius: 0;
  padding: 44px 38px; max-width: 400px; width: 100%; text-align: left;
  box-shadow: none;
}
.brand {
  display: inline-flex; align-items: baseline; gap: 10px;
  font-family: var(--display); font-size: 20px; font-weight: 600;
  letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink); margin-bottom: 6px;
}
.brand .dot { width: 10px; height: 10px; border-radius: 0; background: var(--e-4); flex-shrink: 0; }
.brand .dot::after { content: none; }
.subtitle {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 30px; padding-bottom: 14px; border-bottom: 1px solid var(--rule);
}
.form-group { display: flex; flex-direction: column; gap: 12px; }
.form-group label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: -8px;
}
.form-group input {
  padding: 11px 0; border: none; border-bottom: 1px solid var(--rule); border-radius: 0;
  font-family: 'Source Serif 4', serif; font-size: 15px; color: var(--ink); background: transparent;
  outline: none; transition: border-color .14s cubic-bezier(.22,1,.36,1);
}
.form-group input:focus { border-bottom-color: var(--jade-dark); }
.submit-btn {
  background: var(--ink); color: var(--bg); border: 1px solid var(--ink); border-radius: 0;
  padding: 13px; font-family: var(--display); font-size: 13px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  transition: background .14s cubic-bezier(.22,1,.36,1); width: 100%; margin-top: 10px;
}
.submit-btn:hover { background: var(--jade-dark); border-color: var(--jade-dark); }
.submit-btn:disabled { opacity: .4; cursor: not-allowed; }
.switch-mode { margin-top: 20px; font-family: var(--mono); font-size: 12px; color: var(--ink-mute); }
.switch-mode a { color: var(--ink); cursor: pointer; font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--rule); }
.switch-mode a:hover { border-color: var(--jade-dark); color: var(--jade-dark); }
.msg {
  margin-top: 16px; padding: 11px 14px; border-radius: 0; font-family: var(--mono);
  font-size: 12px; display: none; border-left: 3px solid transparent;
}
.msg.success { display: block; background: var(--bg-soft); color: var(--ink); border-left-color: var(--jade-dark); }
.msg.error { display: block; background: var(--bg-soft); color: var(--c-rust); border-left-color: var(--c-rust); }
.footer { margin-top: 24px; font-family: var(--mono); font-size: 11px; color: var(--ink-mute); }
.footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); }
.header-bar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: flex-end; gap: 10px; padding: 20px 24px; z-index: 2; }
.theme-toggle {
  background: none; border: 1px solid var(--rule); width: 30px; height: 30px; border-radius: 0;
  cursor: pointer; font-size: 0; display: inline-flex; align-items: center; justify-content: center;
  transition: border-color .14s; padding: 0; position: relative;
}
.theme-toggle::after { content: ''; width: 12px; height: 12px; border: 1px solid var(--ink); background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }
.theme-toggle:hover { border-color: var(--ink); }
.lang-switch { display: inline-flex; border: 1px solid var(--rule); border-radius: 0; overflow: hidden; }
.lang-switch button {
  background: none; border: none; border-right: 1px solid var(--rule); padding: 5px 10px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
  color: var(--graphite-low); cursor: pointer; transition: all .14s;
}
.lang-switch button:last-child { border-right: none; }
.lang-switch button.active { background: var(--graphite); color: var(--paper); box-shadow: none; }
.divider { display: flex; align-items: center; margin: 20px 0; font-family: var(--mono); color: var(--ink-mute); font-size: 11px; letter-spacing: 0.06em; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
.divider span { padding: 0 12px; text-transform: uppercase; }
.google-btn, .oauth-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
  padding: 11px; border: 1px solid var(--rule); border-radius: 0; background: var(--bg);
  font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
  color: var(--ink); cursor: pointer; transition: all .14s; margin-top: 8px;
}
.google-btn:hover, .oauth-btn:hover { border-color: var(--ink); background: var(--bg-soft); }
html.dark .google-btn, html.dark .submit-btn, html.dark button { background: var(--bg-soft); color: var(--ink); border: 1px solid var(--rule); }
html.dark .google-btn:hover, html.dark button:hover { background: var(--jade-bg); border-color: var(--jade-dark); }
html.dark .submit-btn { background: var(--jade-dark); color: #131211; border: 1px solid var(--jade-dark); }
html.dark .submit-btn:hover { background: var(--jade); }
html.dark .lang-switch button.active { background: var(--graphite); color: var(--paper); box-shadow: none; }


.skip-link { position: absolute; left: -9999px; top: 0; z-index: 9999; padding: 8px 16px; background: var(--graphite); color: var(--paper); font-family: var(--mono); font-size: 12px; text-decoration: none; }
.skip-link:focus { left: 8px; top: 8px; }
</style>

        /* Куда вернуть человека после входа.

           на главной и терял то, ради чего вообще шёл.

           Берём ?next= из адреса. Принимаем ТОЛЬКО относительные пути

        function safeNext() {

                const raw = new URLSearchParams(location.search).get('next');
                if (!raw) return '/';
                const dec = decodeURIComponent(raw);
                if (!dec.startsWith('/') || dec.startsWith('//')) return '/';
                return dec;

                sb_not_loaded: 'Supabase не загружен', sb_sdk_missing: 'Supabase SDK не загружен',

                min6_chars: 'Пароль должен содержать минимум 6 символов',
                registering: 'Регистрация...',
                confirmation_sent: 'Письмо с подтверждением отправлено на',
                account_created: 'Аккаунт создан! Теперь войдите.',
                code_sent: 'Код отправлен на', otp_sent_msg: 'Мы отправили письмо на вашу почту',
                back_to_login: 'Войти по логину'
            },
            en: {
                title: 'LCA·AI — Sign In', subtitle: 'Sign in to access calculations',
                google_btn: 'Continue with Google', github_btn: 'GitHub', twitter_btn: 'X / Twitter',
                or: 'or',

                password_label: 'Password', password_ph: 'Enter password',
                login_btn: 'Sign in', confirm_password: 'Confirm password',
                min6_ph: 'Minimum 6 characters', confirm_ph: 'Repeat password',
                reg_btn: 'Register',
                otp_title: 'Sign in with code from email', send_code: 'Send link',
                code_ph: 'Code from email', verify_btn: 'Sign in',
                otp_toggle: 'Sign in with email code',
                no_account: "Don't have an account?", register: 'Register',
                has_account: 'Already have an account?', login_link: 'Sign in',
                agreement: 'By signing in, you agree to the', terms: 'terms of service',
                wechat_label: 'WeChat (coming soon)', discord_btn: 'Discord',
                wechat_alert: 'WeChat login will be available after WeChat Open Platform setup',
                discord_alert: 'Discord OAuth will be available after setting up an app in Discord Developer Portal',
                sb_not_loaded: 'Supabase not loaded', sb_sdk_missing: 'Supabase SDK not loaded',
                logging_in: 'Signing in...', passwords_mismatch: 'Passwords do not match',
                min6_chars: 'Password must be at least 6 characters',
                registering: 'Registering...',
                confirmation_sent: 'Confirmation email sent to',
                account_created: 'Account created! Please sign in.',
                code_sent: 'Code sent to', otp_sent_msg: 'We sent an email to your mailbox',
                back_to_login: 'Sign in with login'
            },
            zh: {
                title: 'LCA·AI — 登录', subtitle: '登录以访问计算',
                google_btn: '使用 Google 继续', github_btn: 'GitHub', twitter_btn: 'X / Twitter',
                or: '或',
                email_label: '邮箱', email_ph: '请输入邮箱',
                password_label: '密码', password_ph: '请输入密码',
                login_btn: '登录', confirm_password: '确认密码',
                min6_ph: '至少6个字符', confirm_ph: '再次输入密码',
                reg_btn: '注册',
                otp_title: '使用邮箱验证码登录', send_code: '发送链接',
                code_ph: '邮箱验证码', verify_btn: '登录',
                otp_toggle: '使用邮箱验证码登录',
                no_account: '没有账户？', register: '注册',
                has_account: '已有账户？', login_link: '登录',
                agreement: '登录即表示您同意', terms: '服务条款',
                wechat_label: '微信（即将上线）', discord_btn: 'Discord',
                wechat_alert: '微信登录将在配置微信开放平台后可用',
                discord_alert: 'Discord OAuth将在Discord Developer Portal配置后可用',
                sb_not_loaded: 'Supabase 未加载', sb_sdk_missing: 'Supabase SDK 未加载',
                logging_in: '登录中...', passwords_mismatch: '密码不匹配',
                min6_chars: '密码至少需要6个字符',
                registering: '注册中...',
                confirmation_sent: '确认邮件已发送至',
                account_created: '账户已创建！请登录。',
                code_sent: '验证码已发送至', otp_sent_msg: '我们已向您的邮箱发送了一封邮件',
                back_to_login: '使用账号登录'
            }
        };
        let loginLang = 'ru';
        function loginT(key) { return LOGIN_I18N[loginLang]?.[key] || LOGIN_I18N.ru[key] || key; }

        function initSupabase() { if (window.supabase) { sbClient = window.supabase.createClient(SB_URL, SB_KEY); return true; } showError(loginT('sb_sdk_missing')); return false; }

        async function checkSession() {
            if (!sbClient) return;
            const { data: { session } } = await sbClient.auth.getSession();
            if (session) {
                window.location.href = REDIRECT;
            }
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('loginForm').style.display = isLoginMode ? 'flex' : 'none';
            document.getElementById('registerForm').style.display = isLoginMode ? 'none' : 'flex';
            document.getElementById('switchText').textContent = isLoginMode ? loginT('no_account') : loginT('has_account');
            document.getElementById('switchLink').textContent = isLoginMode ? loginT('register') : loginT('login_link');
            document.getElementById('subtitle').textContent = loginT('subtitle');
            hideMsg();
        }

        document.getElementById('googleBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            try {
                const { error } = await sbClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: REDIRECT } });
                if (error) showError(translateError(error.message));
            } catch (err) { showError(translateError(err.message)); }
        });

        // NOTE: Requires GitHub provider enabled in Supabase Dashboard → Authentication → Providers
        document.getElementById('githubBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            try {
                const { error } = await sbClient.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: REDIRECT } });
                if (error) showError(translateError(error.message));
            } catch (err) { showError(translateError(err.message)); }
        });

        // Supabase uses 'twitter' as the provider name (not 'x')
        document.getElementById('twitterBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            try {
                const { error } = await sbClient.auth.signInWithOAuth({ provider: 'x', options: { redirectTo: REDIRECT } });
                if (error) showError(translateError(error.message));
            } catch (err) { showError(translateError(err.message)); }
        });

        document.getElementById('wechatBtn').addEventListener('click', () => {
            showError(loginT('wechat_alert'));
        });

        // Discord OAuth via Supabase
        document.getElementById('discordBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            try {
                await sbClient.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: REDIRECT } });
            } catch (e) { showError('Discord: ' + e.message); }
        });


        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = loginT('logging_in');
            try {
                const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
                btn.disabled = false; btn.textContent = loginT('login_btn');
                if (error) showError(translateError(error.message));
                else { window.location.href = REDIRECT; }
            } catch (err) { btn.disabled = false; btn.textContent = loginT('login_btn'); showError(translateError(err.message)); }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            if (password !== passwordConfirm) { showError(loginT('passwords_mismatch')); return; }
            if (password.length < 6) { showError(loginT('min6_chars')); return; }
            const btn = document.getElementById('regBtn');
            btn.disabled = true; btn.textContent = loginT('registering');
            try {
                const { data, error } = await sbClient.auth.signUp({ email, password });
                btn.disabled = false; btn.textContent = loginT('reg_btn');
                if (error) showError(translateError(error.message));
                else if (data.user && data.session) { window.location.href = REDIRECT; }
                else if (data.user && !data.session) { showSuccess(loginT('confirmation_sent') + ' ' + email); toggleMode(); }
                else { showSuccess(loginT('account_created')); toggleMode(); }
            } catch (err) { btn.disabled = false; btn.textContent = loginT('reg_btn'); showError(translateError(err.message)); }
        });

        function translateError(msg) {
            const errors = {
                'Invalid login credentials': { ru: 'Неверный логин или пароль', en: 'Invalid login credentials', zh: '登录凭证无效' },
                'Email not confirmed': { ru: 'Email не подтверждён', en: 'Email not confirmed', zh: '邮箱未确认' },
                'User already registered': { ru: 'Пользователь уже зарегистрирован', en: 'User already registered', zh: '用户已注册' },
                'Invalid email': { ru: 'Некорректный email', en: 'Invalid email', zh: '无效的邮箱' },
                'Password should be at least 6 characters': { ru: 'Пароль должен содержать минимум 6 символов', en: 'Password should be at least 6 characters', zh: '密码至少需要6个字符' },
                'Unable to validate email address: invalid format': { ru: 'Некорректный формат email', en: 'Unable to validate email address: invalid format', zh: '无法验证邮箱地址：格式无效' },
                'Signup is disabled': { ru: 'Регистрация отключена', en: 'Signup is disabled', zh: '注册已关闭' },
                'Email link is invalid or has expired': { ru: 'Ссылка недействительна или истекла', en: 'Email link is invalid or has expired', zh: '链接无效或已过期' },
                'Token has expired or is invalid': { ru: 'Токен истёк или недействителен', en: 'Token has expired or is invalid', zh: '令牌已过期或无效' },
                'For security purposes, you can only request this once every 60 seconds': { ru: 'По соображениям безопасности повторный запрос разрешён раз в 60 секунд', en: 'For security purposes, you can only request this once every 60 seconds', zh: '出于安全考虑，每60秒只能请求一次' },
                'To login please use the link that was sent to your email': { ru: 'Для входа перейдите по ссылке из письма', en: 'To login please use the link that was sent to your email', zh: '请使用发送到您邮箱的链接登录' }
            };
            for (const [key, translations] of Object.entries(errors)) {
                if (msg.includes(key)) return translations[loginLang] || translations.en;
            }
            return msg;
        }
        function showError(msg) { const el = document.getElementById('msg'); el.className = 'msg error'; el.textContent = msg; }
        function showSuccess(msg) { const el = document.getElementById('msg'); el.className = 'msg success'; el.textContent = msg; }
        function hideMsg() { const el = document.getElementById('msg'); el.className = 'msg'; el.textContent = ''; }

        (function() {
            const saved = localStorage.getItem('lca-theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
            const btn = document.getElementById('themeToggle');
            if (btn) { btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙'; btn.addEventListener('click', () => { document.documentElement.classList.toggle('dark'); btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙'; localStorage.setItem('lca-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); }); }
        })();

        (function() {
            const saved = localStorage.getItem('lca-lang');
            const browserLang = (navigator.language || '').toLowerCase();
            const lang = saved || (browserLang.startsWith('ru') ? 'ru' : browserLang.startsWith('en') ? 'en' : 'ru');
            document.querySelectorAll('.lang-switch button').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
                b.addEventListener('click', () => { document.querySelectorAll('.lang-switch button').forEach(x => x.classList.remove('active')); b.classList.add('active'); localStorage.setItem('lca-lang', b.dataset.lang); applyLoginLang(b.dataset.lang); });
            });
            applyLoginLang(lang);
        })();

        function applyLoginLang(lang) {
            loginLang = lang;
            document.documentElement.lang = lang;
            const t = LOGIN_I18N[lang] || LOGIN_I18N.ru;
            document.title = t.title;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.dataset.i18nPlaceholder;
                if (t[key]) el.placeholder = t[key];
            });
            document.getElementById('loginBtn').textContent = t.login_btn;
            document.getElementById('regBtn').textContent = t.reg_btn;
            document.getElementById('switchText').textContent = isLoginMode ? t.no_account : t.has_account;
            document.getElementById('switchLink').textContent = isLoginMode ? t.register : t.login_link;
        }

        document.getElementById('toggleOtp').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('switchMode').style.display = 'none';
            document.getElementById('toggleOtpWrap').style.display = 'none';
            document.getElementById('otpSection').style.display = 'block';
            document.getElementById('otpEmail').value = document.getElementById('loginEmail').value;
            hideMsg();
        });

        document.getElementById('backToLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('otpSection').style.display = 'none';
            document.getElementById('loginForm').style.display = 'flex';
            document.getElementById('switchMode').style.display = '';
            document.getElementById('toggleOtpWrap').style.display = '';
            document.getElementById('otpEmail').style.display = '';
            document.getElementById('sendOtpBtn').style.display = '';
            var sentDiv = document.getElementById('otpSentMsg');
            if (sentDiv) sentDiv.style.display = 'none';
            hideMsg();
        });

        document.getElementById('sendOtpBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            const email = document.getElementById('otpEmail').value;
            if (!email) return;
            const { error } = await sbClient.auth.signInWithOtp({ email });
            if (error) { showError(translateError(error.message)); return; }
            document.getElementById('otpEmail').style.display = 'none';
            document.getElementById('sendOtpBtn').style.display = 'none';
            document.getElementById('otpCodeSection').style.display = 'none';
            var sentDiv = document.getElementById('otpSentMsg');
            if (!sentDiv) {
                sentDiv = document.createElement('div');
                sentDiv.id = 'otpSentMsg';
                sentDiv.style.cssText = 'text-align:center;padding:20px;color:var(--ink);font-size:14px;line-height:1.6';
                sentDiv.innerHTML = '<div style="font-size:32px;margin-bottom:12px">&#9993;</div><div>' + loginT('otp_sent_msg') + '</div><div style="color:var(--ink-mute);font-size:12px;margin-top:6px">' + email + '</div>';
                document.getElementById('otpSection').insertBefore(sentDiv, document.getElementById('otpCodeSection'));
            } else {
                sentDiv.innerHTML = '<div style="font-size:32px;margin-bottom:12px">&#9993;</div><div>' + loginT('otp_sent_msg') + '</div><div style="color:var(--ink-mute);font-size:12px;margin-top:6px">' + email + '</div>';
                sentDiv.style.display = 'block';
            }
        });

        document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
            if (!sbClient) { showError(loginT('sb_not_loaded')); return; }
            const email = document.getElementById('otpEmail').value;
            const token = document.getElementById('otpCode').value;
            const { error } = await sbClient.auth.verifyOtp({ email, token, type: 'email' });
            if (error) { showError(translateError(error.message)); return; }
            window.location.href = '/';
        });

        window.addEventListener('load', () => { if (initSupabase()) checkSession(); });
    </script>
</body>
