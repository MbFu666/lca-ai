version: "3.8"

services:
  openlca:
    build:
      context: .
      dockerfile: Dockerfile.olca
    container_name: lca-openlca
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - lca-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"data/get/descriptors\",\"params\":{\"@type\":\"UnitGroup\"}}", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: lca-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OPENLCA_URL=http://openlca:8080
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
    depends_on:
      openlca:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: lca-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    depends_on:
      - api
    restart: unless-stopped

volumes:
  lca-data:
    driver: local
