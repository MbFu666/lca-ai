version: "3.8"

services:
  openlca:
    build:
      context: .
      dockerfile: Dockerfile.olca
    container_name: lca-openlca
    ports:
      - "8080:8080"
    volumes:
      - lca-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: lca-api
    ports:
      - "8000:8000"
    environment:
      - OPENLCA_URL=http://openlca:8080
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
    depends_on:
      openlca:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: lca-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - api
    restart: unless-stopped

volumes:
  lca-data:
    driver: local
  certbot-etc:
  certbot-var:
