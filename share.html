:root {
  --paper:#F2F0EC; --paper-sunk:#E9E6E0;

html.dark {

body {

body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;

                   linear-gradient(90deg,var(--rule-soft) 1px,transparent 1px);
  background-size:8px 8px; opacity:.5;
}
html.dark body::before { opacity:.28; }
.frame { position:relative; z-index:1; max-width:940px; margin:0 auto; padding:0 24px 80px; }

header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 0; border-bottom:1px solid var(--graphite); flex-wrap:wrap; }
.brand { display:inline-flex; align-items:center; gap:10px; font-family:var(--display); font-size:20px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; color:var(--graphite); text-decoration:none; }
.brand .dot { width:10px; height:10px; background:var(--e-4); flex-shrink:0; }
.brand em { font-style:normal; color:var(--graphite-low); font-weight:400; }
.hdr-tools { display:flex; align-items:center; gap:10px; }
.lang { display:inline-flex; border:1px solid var(--rule); }
.lang button { background:none; border:none; border-right:1px solid var(--rule); padding:6px 10px; font-family:var(--mono); font-size:11px; color:var(--graphite-low); cursor:pointer; transition:all .14s var(--ease); }
.lang button:last-child { border-right:none; }
.lang button.active { background:var(--graphite); color:var(--paper); }
.theme-btn { width:30px; height:30px; border:1px solid var(--rule); background:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; }
.theme-btn::after { content:''; width:12px; height:12px; border:1px solid var(--graphite); background:linear-gradient(90deg,var(--graphite) 50%,transparent 50%); }
.theme-btn:hover { border-color:var(--graphite); }

h1 { font-family:var(--display); font-weight:600; text-transform:uppercase; letter-spacing:-.01em; line-height:1.05; }
h2 { font-family:var(--display); font-size:20px; font-weight:500; text-transform:uppercase; letter-spacing:.02em; margin-bottom:20px; }
.state { padding:96px 0; text-align:center; font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--graphite-low); }
.state.err { color:var(--e-ink); }

.actions-bar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:14px 0; border-bottom:1px solid var(--rule); }
.ab-left { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

.ab-role.editable { color:var(--e-ink); border-color:var(--e-3); }
.ab-who { font-family:var(--mono); font-size:11px; color:var(--graphite-low); }
.ab-right { display:flex; gap:8px; flex-wrap:wrap; }
.ab-btn { font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:8px 14px; border:1px solid var(--rule); background:var(--paper); color:var(--graphite); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; transition:all .14s var(--ease); }

.ab-primary { background:var(--graphite); color:var(--paper); border-color:var(--graphite); }
.ab-primary:hover { background:var(--e-4); border-color:var(--e-4); }
.ab-btn:disabled { opacity:.45; cursor:not-allowed; }

.hero { padding:48px 0 32px; border-bottom:1px solid var(--rule); }
.eyebrow { display:block; font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--graphite-low); margin-bottom:16px; }

section { padding:36px 0; border-bottom:1px solid var(--rule); }

table { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px; }

.calc-head:hover { background:var(--paper-sunk); }
.calc .t { font-size:14px; font-weight:600; }
.calc .d { font-family:var(--mono); font-size:10px; color:var(--graphite-low); margin-top:3px; }
.calc-right { display:flex; align-items:center; gap:12px; }

.calc-body { display:none; padding:0 16px 18px; border-top:1px solid var(--rule-soft); }

footer { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:28px 0; font-family:var(--mono); font-size:11px; color:var(--graphite-low); }

.skip-link:focus { left: 8px; top: 8px; }
</style>

/* Единственный источник правды — amount × factor. Тот же расчёт делает сервер. */
function recompute(d) {
  let total = 0;
  (d.stages||[]).forEach(function (st) {
    let s = 0;
    (st.sub_processes||[]).forEach(function (sp) {
      sp.co2eq = (parseFloat(sp.amount)||0) * (parseFloat(sp.factor)||0);
      s += sp.co2eq;
    });
    st.co2eq = s; total += s;
  });
  (d.stages||[]).forEach(function (st) { st.share_pct = total ? st.co2eq/total*100 : 0; });
  d.total_co2eq = total;
  return total;
}

  show('forkBtn', !!me, kind==='project' ? t.fork_project : t.fork);
  // Правка одиночного расчёта — кнопкой в панели. В проекте правится каждый
  // расчёт отдельно, поэтому там кнопки живут внутри карточек.
  show('editBtn', !!me && canEdit && kind==='history', t.edit);
  show('signInBtn', !me, canEdit ? t.signin_edit : t.signin_view);
  // Вернуть на эту же страницу после входа — иначе человек теряет ссылку
  $('signInBtn').href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search);
}

async function fork() {
  if (!me || !sb) return;
  const t = T(), btn = $('forkBtn');
  btn.disabled = true; btn.textContent = t.saving;
  try {
    if (kind === 'history') {
      const r = await sb.from('user_history').insert({
        user_id: me.id,
        product_title: item.product_title,
        functional_unit: item.functional_unit,
        total_co2eq: item.total_co2eq,
        report_data: JSON.parse(JSON.stringify(item.report_data||{}))
      }).select('id').single();
      if (r.error) throw r.error;
      btn.textContent = t.saved;
      setTimeout(function(){ location.href='/report.html?history='+r.data.id; }, 600);

    } else {
      /* Проект копируется целиком: сам проект + все его расчёты.
         Копия автономна, оригинал не трогаем. */
      const p = await sb.from('user_projects').insert({
        user_id: me.id,
        name: (project.name || 'Project') + ' (copy)'
      }).select('id').single();
      if (p.error) throw p.error;

      if (calcs.length) {
        const rows = calcs.map(function (c) {
          return {
            project_id: p.data.id,
            user_id: me.id,
            report_data: JSON.parse(JSON.stringify(c.report_data||{}))
          };
        });
        const c = await sb.from('project_calculations').insert(rows);
        if (c.error) throw c.error;
      }
      btn.textContent = t.saved;
      setTimeout(function(){ location.href='/cabinet.html'; }, 600);
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = kind==='project' ? t.fork_project : t.fork;
    showToast(t.err_save + ': ' + (e.message||e));
  }
}

function startEdit(calcId) {
  let src;
  if (calcId) {
    const c = calcs.find(function (x) { return String(x.id) === String(calcId); });
    src = c ? c.report_data : {};
  } else {
    src = item.report_data;
  }
  draft = JSON.parse(JSON.stringify(src||{}));
  editing = { calcId: calcId || null };
  renderAll(); renderActions();
  window.scrollTo({ top: 0 });
}
function cancelEdit() { editing=null; draft=null; renderAll(); renderActions(); }

window.__ed = function (si, pi, field, val) {
  if (!draft) return;
  const st = draft.stages && draft.stages[si];
  const sp = st && st.sub_processes && st.sub_processes[pi];
  if (!sp) return;
  sp[field] = parseFloat(val) || 0;
  const total = recompute(draft);
  const el = $('liveTotal');
  if (el) { el.textContent = fmt(total); el.classList.add('dirty'); }
};

async function saveEdit() {
  if (!draft || !sb || !me) return;
  const t = T(), btn = $('saveBtn');
  btn.disabled = true; btn.textContent = t.saving;
  try {
    const s = await sb.auth.getSession();
    const at = s && s.data && s.data.session ? s.data.session.access_token : '';
    const res = await fetch(SB_URL + '/functions/v1/share-edit', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+at },
      body: JSON.stringify({
        token: token,
        report_data: draft,
        calc_id: editing.calcId || undefined
      })
    });
    const out = await res.json().catch(function(){ return {}; });

    if (!res.ok) {
      const map = {
        auth_required: t.err_auth, read_only: t.err_ro, not_your_invite: t.err_invite,
        expired: t.e_410, not_found: t.e_404
      };
      throw new Error(map[out.error] || (t.err_save + ': ' + (out.detail || out.error || res.status)));
    }

    // Сервер пересчитал итог сам — берём его значение, а не своё
    draft.total_co2eq = out.total_co2eq;
    if (editing.calcId) {
      const c = calcs.find(function (x) { return String(x.id) === String(editing.calcId); });
      if (c) c.report_data = draft;
    } else {
      item.report_data = draft;
      item.total_co2eq = out.total_co2eq;
    }
    editing = null; draft = null;
    renderAll(); renderActions();
    btn.disabled = false;
  } catch (e) {
    btn.disabled = false; btn.textContent = T().save;
    showToast(e.message || e);
  }
}

function reportHtml(d, meta, editMode) {
  const t = T();
  const raw = Array.isArray(d.stages) ? d.stages : [];
  const total = parseFloat(d.total_co2eq) || 0;

  /* Исходный индекс запоминаем ДО сортировки: правка адресуется по позиции
     в draft.stages, а на экране стадии идут по убыванию вклада. Без этого
     изменение уехало бы не в ту стадию. */
  const st = raw.map(function (s, si) { return { s: s, si: si }; })
    .sort(function (a, b) { return (parseFloat(b.s.co2eq)||0) - (parseFloat(a.s.co2eq)||0); });
  const max = st.length ? (parseFloat(st[0].s.co2eq)||0) : 1;

  let h = '';
  if (editMode) h += '<div class="edit-note">' + esc(t.edit_note) + '</div>';

  h += '<div class="hero">' +
    '<span class="eyebrow">' + esc(t.eyebrow) + '</span>' +
    '<h1>' + esc(meta.title || '—') + '</h1>' +
    '<div class="hero-num"><span id="liveTotal">' + fmt(total) + '</span><span class="u">kg CO₂e</span></div>' +
    '<div class="meta">' +
      '<div><span class="k">' + esc(t.fu) + '</span><span class="v">' + esc(meta.fu || '—') + '</span></div>' +
      (d.system_boundary ? '<div><span class="k">' + esc(t.sb) + '</span><span class="v">' + esc(d.system_boundary) + '</span></div>' : '') +
      (meta.date ? '<div><span class="k">' + esc(t.date) + '</span><span class="v">' + fmtDate(meta.date) + '</span></div>' : '') +
    '</div></div>';

  if (st.length) {
    h += '<section><h2>' + esc(t.stages) + '</h2><div class="rank">' +
      st.map(function (x, i) {
        const v = parseFloat(x.s.co2eq) || 0;
        const pct = total ? v / total * 100 : 0;
        return '<div class="rank-row"><div class="n">' + esc(x.s.name || '—') + '</div>' +
          '<div class="rank-bar"><div class="rank-fill" style="width:' + (max ? v/max*100 : 0).toFixed(1) +
          '%;background:' + RAMP[Math.min(i, RAMP.length-1)] + '"></div></div>' +
          '<div class="v">' + fmt(v) + ' kg · ' + pct.toFixed(0) + '%</div></div>';
      }).join('') + '</div></section>';

    const hasSub = st.some(function (x) {
      return Array.isArray(x.s.sub_processes) && x.s.sub_processes.length;
    });

    if (hasSub) {
      h += '<section><h2>' + esc(t.inventory) + '</h2><table><thead><tr>' +
        '<th>' + esc(t.th_proc) + '</th>' +
        '<th>' + esc(editMode ? t.th_amount : t.th_data) + '</th>' +
        (editMode ? '<th>' + esc(t.th_factor) + '</th>' : '') +
        '<th style="text-align:right">kg CO₂e</th><th>' + esc(t.th_src) + '</th></tr></thead><tbody>';

      st.forEach(function (x, i) {
        const col = RAMP[Math.min(i, RAMP.length-1)];
        h += '<tr class="stage-row"><td style="border-left:3px solid ' + col + '">' + esc(x.s.name || '—') + '</td>' +
             (editMode ? '<td></td>' : '') + '<td></td>' +
             '<td class="num">' + fmt(x.s.co2eq) + '</td><td></td></tr>';

        (x.s.sub_processes || []).forEach(function (sp, pi) {
          if (editMode) {
            h += '<tr class="sub"><td>' + esc(sp.name || '—') + '</td>' +
              '<td><input class="edit-input" type="number" step="any" value="' + (parseFloat(sp.amount)||0) +
                '" oninput="__ed(' + x.si + ',' + pi + ',&quot;amount&quot;,this.value)"> ' +
                '<span class="src">' + esc(sp.unit || '') + '</span></td>' +
              '<td><input class="edit-input" type="number" step="any" value="' + (parseFloat(sp.factor)||0) +
                '" oninput="__ed(' + x.si + ',' + pi + ',&quot;factor&quot;,this.value)"></td>' +
              '<td class="num">' + fmt(sp.co2eq) + '</td>' +
              '<td class="src">' + esc(sp.factor_source || sp.source || '—') + '</td></tr>';
          } else {
            h += '<tr class="sub"><td>' + esc(sp.name || '—') + '</td>' +
              '<td class="src">' + esc([sp.amount, sp.unit].filter(Boolean).join(' ')) + '</td>' +
              '<td class="num">' + fmt(sp.co2eq) + '</td>' +
              '<td class="src">' + esc(sp.factor_source || sp.source || '—') + '</td></tr>';
          }
        });
      });
      h += '</tbody></table></section>';
    }
  }

  if (d.total_description) {
    h += '<section><h2>' + esc(t.analysis) + '</h2><div class="prose">' + esc(d.total_description) + '</div></section>';
  }
  return h;
}

function renderAll() {
  if (!kind) return;
  const t = T();

  if (kind === 'history') {
    if (!item) return setState(t.e_none, true);
    const editMode = !!editing;
    const d = editMode ? draft : (item.report_data || {});
    $('root').innerHTML = reportHtml(d, {
      title: item.product_title, fu: item.functional_unit, date: item.created_at
    }, editMode);
    document.title = (item.product_title || '—') + ' — LCA·AI';
    return;
  }

  if (!project) return setState(t.e_none, true);

  // Правка конкретного расчёта внутри проекта — показываем только его
  if (editing && editing.calcId) {
    const c = calcs.find(function (x) { return String(x.id) === String(editing.calcId); });
    const cd = c ? (c.report_data || {}) : {};
    $('root').innerHTML = reportHtml(draft, {
      title: cd.product_title, fu: cd.functional_unit, date: c && c.created_at
    }, true);
    return;
  }

  const vals = calcs
    .map(function (c) { return parseFloat(c.report_data && c.report_data.total_co2eq) || 0; })
    .filter(function (v) { return v > 0; });
  const med = (function () {
    if (!vals.length) return 0;
    const s = vals.slice().sort(function (a,b) { return a-b; });
    return s.length % 2 ? s[(s.length-1)/2] : (s[s.length/2 - 1] + s[s.length/2]) / 2;
  })();

  let h = '<div class="hero">' +
    '<span class="eyebrow">' + esc(t.project) + ' · ' + calcs.length + ' ' + esc(t.calcs) + '</span>' +
    '<h1>' + esc(project.name || '—') + '</h1>' +
    '<div class="hero-num">' + fmt(med) + '<span class="u">kg CO₂e</span></div>' +
    '<div class="meta">' +
      '<div><span class="k">' + esc(t.median) + '</span><span class="v">' + esc(t.by) + ' ' + calcs.length + '</span></div>' +
      '<div><span class="k">' + esc(t.created) + '</span><span class="v">' + fmtDate(project.created_at) + '</span></div>' +
    '</div></div>';

  if (!calcs.length) {
    h += '<div class="state">' + esc(t.no_calcs) + '</div>';
  } else {
    h += '<section><h2>' + esc(t.calculations) + '</h2>' + calcs.map(function (c) {
      const d = c.report_data || {};
      const canEdit = (role === 'edit' && !!me);
      return '<div class="calc" data-id="' + esc(c.id) + '">' +
        '<div class="calc-head" onclick="__toggle(&quot;' + esc(c.id) + '&quot;)">' +
          '<div><div class="t">' + esc(d.product_title || '—') + '</div>' +
          '<div class="d">' + esc(d.functional_unit || '—') + ' · ' + fmtDate(c.created_at) + '</div></div>' +
          '<div class="calc-right"><div class="c">' + fmt(d.total_co2eq) + ' kgCO₂e</div>' +
          '<span class="calc-chev">▸</span></div>' +
        '</div>' +
        '<div class="calc-body">' +
          reportHtml(d, { title: d.product_title, fu: d.functional_unit, date: c.created_at }, false) +
          (canEdit
            ? '<div class="calc-actions"><button class="ab-btn ab-primary" onclick="__editCalc(&quot;' + esc(c.id) + '&quot;)">' + esc(t.edit) + '</button></div>'
            : '') +
        '</div></div>';
    }).join('') + '</section>';
  }

  $('root').innerHTML = h;
  document.title = (project.name || '—') + ' — LCA·AI';
}

window.__toggle = function (id) {
  const el = document.querySelector('.calc[data-id="' + CSS.escape(String(id)) + '"]');
  if (!el) return;
  el.classList.toggle('open');
  const ch = el.querySelector('.calc-chev');
  if (ch) ch.textContent = el.classList.contains('open') ? '▾' : '▸';
};
window.__editCalc = function (id) { startEdit(id); };

$('forkBtn').addEventListener('click', fork);
$('editBtn').addEventListener('click', function () { startEdit(null); });
$('cancelBtn').addEventListener('click', cancelEdit);
$('saveBtn').addEventListener('click', saveEdit);

(async function () {
  applyLang();
  token = new URLSearchParams(location.search).get('token');
  if (!token) return setState(T().e_token, true);
  setState(T().loading, false);

  // Авторизация необязательна: чтение работает и без неё.
  // С ней появляются «сохранить себе» и, если разрешено, правка.
  try {
    sb = window.supabase.createClient(SB_URL, SB_KEY);
    const u = await sb.auth.getUser();
    me = (u && u.data && u.data.user) ? u.data.user : null;
  } catch (e) { sb = null; me = null; }

  try {
    const res = await fetch(SB_URL + '/functions/v1/share-view?token=' + encodeURIComponent(token), {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    const t = T();
    if (res.status === 401) return setState(t.e_401, true);
    if (res.status === 404) return setState(t.e_404, true);
    if (res.status === 410) return setState(t.e_410, true);
    if (!res.ok)            return setState(t.e_load, true);

    const data = await res.json();
    role = data.role || 'view';
    kind = data.kind;

    if (kind === 'history')      { item = data.item; }
    else if (kind === 'project') { project = data.project; calcs = data.calculations || []; }
    else return setState(t.e_kind, true);

    renderAll();
    renderActions();
  } catch (e) {
    setState(T().e_net, true);
  }
})();
</script>
</body>
