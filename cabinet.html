        header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--rule); }

        .brand em { font-style: normal; color: var(--jade); font-weight: 700; }
        .nav { display: flex; gap: 20px; align-items: center; }
        .nav a { color: var(--ink-soft); text-decoration: none; font-size: 14px; font-weight: 500; transition: color .15s; }
        .nav a:hover { color: var(--jade); }
        .nav a.active { color: var(--jade); font-weight: 600; }
        .theme-toggle { background: none; border: 1px solid var(--rule); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; transition: all .15s; padding: 0; }
        .theme-toggle:hover { border-color: var(--jade); background: var(--jade-bg); }
        .lang-switch { display: inline-flex; background: var(--bg-soft); border-radius: 30px; padding: 3px; border: 1px solid var(--rule); }
        .lang-switch button { background: none; border: none; padding: 5px 10px; border-radius: 30px; font-size: 11px; font-weight: 600; color: var(--ink-mute); cursor: pointer; transition: all .15s; }
        .lang-switch button.active { background: white; color: var(--ink); box-shadow: 0 1px 4px rgba(14,46,39,0.08); }
        html.dark .lang-switch button.active { background: var(--jade-bg); color: var(--ink); box-shadow: none; }
        .layout { display: grid; grid-template-columns: 260px 1fr; gap: 32px; padding: 32px 0; }
        @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
        .sidebar { position: sticky; top: 32px; align-self: start; }
        .profile-card { background: var(--bg-soft); border: 1px solid var(--rule); border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; background: var(--jade); color: white; }
        .profile-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .profile-email { font-size: 13px; color: var(--ink-mute); margin-bottom: 16px; }
        .profile-stats { display: flex; justify-content: center; gap: 24px; padding-top: 16px; border-top: 1px solid var(--rule); }
        .stat { text-align: center; }
        .stat-num { font-size: 20px; font-weight: 700; color: var(--jade); font-family: var(--mono); }
        .stat-label { font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .05em; }
        .menu { list-style: none; }
        .menu li { margin-bottom: 4px; }
        .menu a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; color: var(--ink-soft); text-decoration: none; font-size: 14px; font-weight: 500; transition: all .15s; cursor: pointer; }
        .menu a:hover { background: var(--bg-soft); color: var(--ink); }
        .menu a.active { background: var(--jade-bg); color: var(--jade-deep); font-weight: 600; }
        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.02em; }
        .card { background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; margin-bottom: 16px; transition: all .15s; }
        .card:hover { border-color: var(--jade-bg); box-shadow: 0 4px 12px rgba(20,201,151,0.1); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-size: 15px; font-weight: 600; }
        .card-date { font-size: 12px; color: var(--ink-mute); font-family: var(--mono); }
        .card-meta { display: flex; gap: 16px; font-size: 13px; color: var(--ink-soft); }
        .card-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn { padding: 8px 16px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; border: none; text-decoration: none; display: inline-block; }
        .btn-primary { background: var(--jade); color: white; }
        .btn-primary:hover { background: var(--jade-dark); }
        .btn-danger { background: none; border: 1px solid var(--c-rust); color: var(--c-rust); }
        .btn-danger:hover { background: var(--c-rust); color: white; }
        .empty { text-align: center; padding: 60px 20px; color: var(--ink-mute); }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-text { font-size: 14px; margin-bottom: 20px; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 1000; opacity: 0; transform: translateY(10px); transition: all .3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--rule); }
        .setting-row:last-child { border-bottom: none; }
        .setting-label { font-size: 14px; font-weight: 500; }
        .toggle { position: relative; width: 48px; height: 26px; background: var(--rule); border-radius: 13px; cursor: pointer; transition: background .2s; }
        .toggle.active { background: var(--jade); }
        .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: transform .2s; }
        .toggle.active::after { transform: translateX(22px); }
        .project-card { overflow: hidden; }
        .project-calcs { border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 12px; }
        .calc-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: all .15s; }

        .calc-name { font-size: 13px; font-weight: 600; }
        .calc-date { font-size: 11px; color: var(--ink-mute); }
        .calc-total { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--jade); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

            }
            if (!session) { 
                console.log('[Cabinet] No session, redirecting to login');
                window.location.href = '/login.html'; 
                return; 
            }
            currentUser = session.user;
            console.log('[Cabinet] User loaded:', currentUser.email, 'ID:', currentUser.id);
            renderProfile();
            fillProfileFields();
            console.log('[Cabinet] Profile rendered, loading history...');
            await loadTab('history');
            console.log('[Cabinet] Init complete');
        }

        function renderProfile() {
            if (!currentUser) return;
            const name = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email;
            const picture = currentUser.user_metadata?.avatar_url || currentUser.user_metadata?.picture;
            document.getElementById('profileName').textContent = name;
            document.getElementById('profileEmail').textContent = currentUser.email || '';
            const avatarEl = document.getElementById('avatar');
            if (picture) { avatarEl.innerHTML = '<img src="' + picture + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover">'; }
            else { avatarEl.textContent = name.charAt(0).toUpperCase(); }
            loadStats();
        }

        async function loadStats() {
            if (!currentUser || !db) return;
            try {
                const { count: c } = await db.from('user_history').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id);
                const { count: p } = await db.from('user_projects').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id);
                document.getElementById('statCalcs').textContent = c || 0;
                document.getElementById('statProjects').textContent = p || 0;
            } catch (e) { console.error('loadStats error:', e); showToast(t('err_load_stats')); }
        }

        document.querySelectorAll('.menu a[data-tab]').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                const tab = a.dataset.tab;
                if (tab === 'logout') { 
                    if (db) db.auth.signOut(); 
                    localStorage.clear(); 
                    window.location.href = '/'; 
                    return; 
                }
                document.querySelectorAll('.menu a').forEach(x => x.classList.remove('active'));
                a.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(x => x.style.display = 'none');
                document.getElementById('tab-' + tab).style.display = 'block';
                loadTab(tab);
            });
        });

        async function loadTab(tab) {
            if (tab === 'history') await loadHistory();
            if (tab === 'projects') await loadProjects();
            if (tab === 'settings') fillProfileFields();
        }

        async function loadHistory() {
            if (!currentUser || !db) {
                console.log('[Cabinet] loadHistory skipped: no user or db');
                return;
            }
            console.log('[Cabinet] loadHistory for user:', currentUser.id);
            try {
                const { data, error } = await db.from('user_history').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
                if (error) throw error;
                console.log('[Cabinet] loadHistory result:', data?.length, 'rows');
                const list = document.getElementById('historyList');
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">' + t('no_history') + '</div><a href="/" class="btn btn-primary">' + t('do_calc') + '</a></div>';
                    return;
                }
                list.innerHTML = data.map(h => '<div class="card"><div class="card-header"><div class="card-title">' + esc(h.product_title || '—') + '</div><div class="card-date">' + new Date(h.created_at).toLocaleDateString(cabinetLang === 'zh' ? 'zh-CN' : cabinetLang) + '</div></div><div class="card-meta"><span>📦 ' + esc(h.functional_unit || '—') + '</span><span>🌱 ' + (h.total_co2eq || 0) + ' kgCO₂e</span></div><div class="card-actions"><a href="/report.html?history=' + h.id + '" class="btn btn-primary">' + t('view') + '</a><button class="share-history-btn" data-id="' + h.id + '" title="Скопировать ссылку" style="background:none;border:none;cursor:pointer;padding:4px 8px;font-size:16px">🔗</button><button class="btn btn-danger" onclick="deleteHistory(\'' + h.id + '\')">' + t('delete') + '</button></div></div>').join('');
            } catch (e) { 
                console.error('loadHistory error:', e); 
                showToast(t('err_load_history') + (e.message || e)); 
            }
        }

        async function deleteHistory(id) {
            if (!confirm(t('confirm_delete_calc'))) return;
            try {
                const { error } = await db.from('user_history').delete().eq('id', id);
                if (error) throw error;
                const cached = JSON.parse(localStorage.getItem('lca-history') || '[]');
                const filtered = cached.filter(e => String(e.id) !== String(id));
                localStorage.setItem('lca-history', JSON.stringify(filtered));
                loadHistory();
                loadStats();
                showToast(t('toast_deleted'));
            } catch (e) {
                showToast(t('err_delete') + (e.message || e));
            }
        }

        async function loadProjects() {
            if (!currentUser || !db) {
                console.log('[Cabinet] loadProjects skipped: no user or db');
                return;
            }
            console.log('[Cabinet] loadProjects for user:', currentUser.id);
            try {
                const { data: projects, error: pErr } = await db.from('user_projects').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
                if (pErr) throw pErr;
                const list = document.getElementById('projectsList');
                if (!projects || projects.length === 0) {
                    list.innerHTML = '<div class="empty"><div class="empty-icon">📁</div><div class="empty-text">' + t('no_projects') + '</div><button class="btn btn-primary" onclick="createProject()">' + t('create') + '</button></div>';
                    return;
                }
                let html = '';
                for (const p of projects) {
                    const { data: calcs } = await db.from('project_calculations').select('*').eq('project_id', p.id).order('created_at', { ascending: false });
                    const calcCount = (calcs || []).length;
                    html += '<div class="card project-card" id="proj-' + p.id + '">';
                    html += '<div class="card-header">';
                    html += '<div class="card-title">' + esc(p.name) + ' <button class="share-project-btn" data-id="' + p.id + '" title="Скопировать ссылку" style="background:none;border:none;cursor:pointer;padding:4px 8px;font-size:16px">🔗</button></div>';
                    html += '<div class="card-date">' + calcCount + ' ' + t('calcs_count') + ' · ' + new Date(p.created_at).toLocaleDateString(cabinetLang === 'zh' ? 'zh-CN' : cabinetLang) + '</div>';
                    html += '</div>';
                    if (calcs && calcs.length > 0) {
                        html += '<div class="project-calcs" style="display:none">';
                        calcs.forEach(c => {
                            const product = c.report_data?.product_title || t('unnamed');
                            const total = c.report_data?.total_co2eq || 0;
                            const date = new Date(c.created_at).toLocaleDateString(cabinetLang === 'zh' ? 'zh-CN' : cabinetLang);
                            html += '<div class="calc-item">';
                            html += '<div class="calc-info" onclick="window.location.href=\'/report.html?history=' + c.id + '\'" style="cursor:pointer;flex:1"><div class="calc-name">' + esc(product) + '</div><div class="calc-date">' + date + '</div></div>';
                            html += '<div class="calc-total">' + total + ' kgCO₂e</div>';
                            html += '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteCalcFromProject(\'' + c.id + '\')" title="' + t('delete') + '">✕</button>';
                            html += '</div>';
                        });
                        html += '</div>';
                    }
                    html += '<div class="card-actions">';
                    html += '<button class="btn btn-sm" onclick="toggleProjectCalcs(\'' + p.id + '\')">▸ ' + t('calculations') + '</button>';
                    html += '<button class="btn btn-danger" onclick="deleteProject(\'' + p.id + '\')">' + t('delete') + '</button>';
                    html += '</div>';
                    html += '</div>';
                }
                list.innerHTML = html;
            } catch (e) { 
                console.error('loadProjects error:', e); 
                showToast(t('err_load_projects') + (e.message || e)); 
            }
        }

        function toggleProjectCalcs(projectId) {
            const el = document.getElementById('proj-' + projectId);
            if (!el) return;
            const calcs = el.querySelector('.project-calcs');
            if (!calcs) return;
            const isHidden = calcs.style.display === 'none';
            calcs.style.display = isHidden ? 'block' : 'none';
        }

        document.getElementById('newProjectBtn').addEventListener('click', createProject);

        async function createProject() {
            const name = prompt(t('project_name_prompt'));
            if (!name || !name.trim()) return;
            try { 
                const { error } = await db.from('user_projects').insert({ user_id: currentUser.id, name: name.trim() }); 
                if (error) throw error;
                loadProjects(); 
                loadStats(); 
                showToast(t('toast_project_created')); 
            } catch (e) { 
                showToast(t('err_create') + (e.message || e)); 
            }
        }

        async function deleteProject(id) {
            if (!confirm(t('confirm_delete_project'))) return;
            try { 
                const { error: e1 } = await db.from('project_calculations').delete().eq('project_id', id); 
                const { error: e2 } = await db.from('user_projects').delete().eq('id', id); 
                if (e1 || e2) throw (e1 || e2);
                loadProjects(); 
                loadStats(); 
                showToast(t('toast_deleted')); 
            } catch (e) { 
                showToast(t('err_delete') + (e.message || e)); 
            }
        }

        async function deleteCalcFromProject(calcId) {
            if (!confirm(t('confirm_delete_calc_from_proj'))) return;
            try {
                const { error } = await db.from('project_calculations').delete().eq('id', calcId);
                if (error) throw error;
                loadProjects();
                loadStats();
                showToast(t('toast_calc_deleted'));
            } catch (e) {
                showToast(t('err_delete') + (e.message || e));
            }
        }

        document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
            if (!confirm(t('confirm_delete_account'))) return;
            try {
                await db.from('user_history').delete().eq('user_id', currentUser.id);
                await db.from('project_calculations').delete().eq('user_id', currentUser.id);
                await db.from('user_projects').delete().eq('user_id', currentUser.id);
                await db.auth.signOut();
                localStorage.clear();
                window.location.href = '/';
            } catch (e) { showToast(t('err_generic') + (e.message || e)); }
        });

        document.getElementById('changePasswordBtn').addEventListener('click', async () => {
            const pw = document.getElementById('newPassword').value;
            const pw2 = document.getElementById('confirmNewPassword').value;
            if (pw !== pw2) { showToast(t('pw_mismatch')); return; }
            if (pw.length < 6) { showToast(t('pw_min6')); return; }
            const { error } = await db.auth.updateUser({ password: pw });
            if (error) showToast(error.message);
            else { showToast(t('toast_pw_changed')); document.getElementById('newPassword').value = ''; document.getElementById('confirmNewPassword').value = ''; }
        });

        /* ── Language init & switcher ── */
        (function() {
            const saved = localStorage.getItem('lca-lang');
            const browserLang = (navigator.language || '').toLowerCase();
            const lang = saved || (browserLang.startsWith('zh') ? 'zh' : browserLang.startsWith('en') ? 'en' : 'ru');
            cabinetLang = lang;
            document.getElementById('langSelect').value = lang;
            document.querySelectorAll('.lang-switch button').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
                b.addEventListener('click', () => {
                    localStorage.setItem('lca-lang', b.dataset.lang);
                    applyCabinetLang(b.dataset.lang);
                    showToast(t('toast_lang_saved'));
                });
            });
            applyCabinetLang(lang);
        })();

        document.getElementById('langSelect').addEventListener('change', e => {
            const lang = e.target.value;
            localStorage.setItem('lca-lang', lang);
            applyCabinetLang(lang);
            showToast(t('toast_lang_saved'));
        });

        function fillProfileFields() {
            if (!currentUser) return;
            document.getElementById('editProfileName').value = currentUser.user_metadata?.full_name || '';
            document.getElementById('editProfileAvatar').value = currentUser.user_metadata?.avatar_url || '';
        }

        document.getElementById('saveProfileBtn').addEventListener('click', async () => {
            const name = document.getElementById('editProfileName').value.trim();
            const avatar = document.getElementById('editProfileAvatar').value.trim();
            const { error } = await db.auth.updateUser({ data: { full_name: name, avatar_url: avatar } });
            if (error) { showToast(error.message); return; }
            currentUser.user_metadata = { ...currentUser.user_metadata, full_name: name, avatar_url: avatar };
            showToast(t('toast_profile_saved'));
            renderProfile();
        });

        function syncThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
            const dt = document.getElementById('darkToggle');
            if (isDark) dt.classList.add('active'); else dt.classList.remove('active');
        }
        const headerToggle = document.getElementById('themeToggle');
        headerToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('lca-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            syncThemeUI();
        });
        const settingsToggle = document.getElementById('darkToggle');
        settingsToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('lca-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            syncThemeUI();
        });
        const savedTheme = localStorage.getItem('lca-theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        syncThemeUI();

        document.addEventListener('click', (e) => {
            const shareProject = e.target.closest('.share-project-btn');
            if (shareProject) {
                e.stopPropagation();
                const url = window.location.origin + '/report.html?project=' + shareProject.dataset.id;
                navigator.clipboard.writeText(url).then(() => showToast(t('toast_link_copied')));
                return;
            }
            const shareHistory = e.target.closest('.share-history-btn');
            if (shareHistory) {
                e.stopPropagation();
                const url = window.location.origin + '/report.html?history=' + shareHistory.dataset.id;
                navigator.clipboard.writeText(url).then(() => showToast(t('toast_link_copied')));
            }
        });

        init();
    </script>
</body>
</html>
