<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCA·AI — Личный кабинет</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #FFFFFF; --bg-soft: #F8FAFA; --ink: #0E2E27; --ink-soft: #4D5E61; --ink-mute: #93A0A6;
            --rule: #E5E8EB; --jade: #14C997; --jade-dark: #0FB386; --jade-deep: #0A8567; --jade-bg: #ECFAF4;
            --c-rust: #C25450; --sans: 'Manrope', system-ui, sans-serif; --mono: 'JetBrains Mono', monospace;
        }
        html.dark { --bg: #0F1F1B; --bg-soft: #162B26; --ink: #E8F0ED; --ink-soft: #A0B0AA; --ink-mute: #6B7D78; --rule: #2A3F39; --jade-bg: #1A332D; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); background: var(--bg); color: var(--ink); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--rule); }
        .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; color: var(--ink); text-decoration: none; }
        .brand .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--jade); display: inline-flex; align-items: center; justify-content: center; }
        .brand .dot::after { content: ''; width: 9px; height: 9px; background: white; border-radius: 50%; }
        .brand em { font-style: normal; color: var(--jade); font-weight: 700; }
        .nav { display: flex; gap: 20px; align-items: center; }
        .nav a { color: var(--ink-soft); text-decoration: none; font-size: 14px; font-weight: 500; transition: color .15s; }
        .nav a:hover { color: var(--jade); }
        .nav a.active { color: var(--jade); font-weight: 600; }
        .theme-toggle { background: none; border: 1px solid var(--rule); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; transition: all .15s; padding: 0; }
        .theme-toggle:hover { border-color: var(--jade); background: var(--jade-bg); }
        .layout { display: grid; grid-template-columns: 260px 1fr; gap: 32px; padding: 32px 0; }
        @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
        .sidebar { position: sticky; top: 32px; align-self: start; }
        .profile-card { background: var(--bg-soft); border: 1px solid var(--rule); border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; background: var(--jade); color: white; }
        .profile-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .profile-email { font-size: 13px; color: var(--ink-mute); margin-bottom: 16px; }
        .profile-stats { display: flex; justify-content: center; gap: 24px; padding-top: 16px; border-top: 1px solid var(--rule); }
        .stat { text-align: center; }
        .stat-num { font-size: 20px; font-weight: 700; color: var(--jade); font-family: var(--mono); }
        .stat-label { font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .05em; }
        .menu { list-style: none; }
        .menu li { margin-bottom: 4px; }
        .menu a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; color: var(--ink-soft); text-decoration: none; font-size: 14px; font-weight: 500; transition: all .15s; cursor: pointer; }
        .menu a:hover { background: var(--bg-soft); color: var(--ink); }
        .menu a.active { background: var(--jade-bg); color: var(--jade-deep); font-weight: 600; }
        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.02em; }
        .card { background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; margin-bottom: 16px; transition: all .15s; }
        .card:hover { border-color: var(--jade-bg); box-shadow: 0 4px 12px rgba(20,201,151,0.1); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-size: 15px; font-weight: 600; }
        .card-date { font-size: 12px; color: var(--ink-mute); font-family: var(--mono); }
        .card-meta { display: flex; gap: 16px; font-size: 13px; color: var(--ink-soft); }
        .card-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn { padding: 8px 16px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; border: none; text-decoration: none; display: inline-block; }
        .btn-primary { background: var(--jade); color: white; }
        .btn-primary:hover { background: var(--jade-dark); }
        .btn-danger { background: none; border: 1px solid var(--c-rust); color: var(--c-rust); }
        .btn-danger:hover { background: var(--c-rust); color: white; }
        .empty { text-align: center; padding: 60px 20px; color: var(--ink-mute); }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-text { font-size: 14px; margin-bottom: 20px; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 1000; opacity: 0; transform: translateY(10px); transition: all .3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--rule); }
        .setting-row:last-child { border-bottom: none; }
        .setting-label { font-size: 14px; font-weight: 500; }
        .toggle { position: relative; width: 48px; height: 26px; background: var(--rule); border-radius: 13px; cursor: pointer; transition: background .2s; }
        .toggle.active { background: var(--jade); }
        .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: transform .2s; }
        .toggle.active::after { transform: translateX(22px); }
    </style>
</head>
<body>
    <header>
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;width:100%">
            <a href="/" class="brand"><span class="dot"></span>LCA<em>·</em>AI</a>
            <div class="nav">
                <a href="/">Главная</a>
                <a href="/cabinet.html" class="active">Кабинет</a>
                <button class="theme-toggle" id="themeToggle">🌙</button>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="layout">
            <aside class="sidebar">
                <div class="profile-card">
                    <div class="avatar" id="avatar">—</div>
                    <div class="profile-name" id="profileName">Загрузка...</div>
                    <div class="profile-email" id="profileEmail">—</div>
                    <div class="profile-stats">
                        <div class="stat"><div class="stat-num" id="statCalcs">0</div><div class="stat-label">Расчётов</div></div>
                        <div class="stat"><div class="stat-num" id="statProjects">0</div><div class="stat-label">Проектов</div></div>
                    </div>
                </div>
                <ul class="menu">
                    <li><a href="#" class="active" data-tab="history">📊 История</a></li>
                    <li><a href="#" data-tab="projects">📁 Проекты</a></li>
                    <li><a href="#" data-tab="settings">⚙️ Настройки</a></li>
                    <li><a href="#" data-tab="logout">🚪 Выйти</a></li>
                </ul>
            </aside>
            
            <main>
                <div class="tab-content" id="tab-history">
                    <h2 class="section-title">История расчётов</h2>
                    <div id="historyList"></div>
                </div>
                <div class="tab-content" id="tab-projects" style="display:none">
                    <h2 class="section-title">Проекты</h2>
                    <button class="btn btn-primary" id="newProjectBtn" style="margin-bottom:20px">+ Новый проект</button>
                    <div id="projectsList"></div>
                </div>
                <div class="tab-content" id="tab-settings" style="display:none">
                    <h2 class="section-title">Настройки</h2>
                    <div class="card">
                        <div class="setting-row">
                            <div><div class="setting-label">Тёмная тема</div></div>
                            <div class="toggle" id="darkToggle"></div>
                        </div>
                        <div class="setting-row">
                            <div><div class="setting-label">Язык</div></div>
                            <select id="langSelect" style="padding:6px 12px;border:1px solid var(--rule);border-radius:6px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--ink)">
                                <option value="ru">Русский</option>
                                <option value="en">English</option>
                                <option value="zh">中文</option>
                            </select>
                        </div>
                        <div class="setting-row">
                            <div><div class="setting-label">Удалить аккаунт</div></div>
                            <button class="btn btn-danger" id="deleteAccountBtn">Удалить</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const SB_URL = 'https://pbisngkepszwzzjivxus.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBiaXNuZ2tlcHN6d3p6aml2eHVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NDQzMjQsImV4cCI6MjA5OTAyMDMyNH0.RV7GaTA7Wo2JIPMChh8j4ro7eXqZA9g_vCOnfjJ1bJY';
        
        function getSB() {
            if (window.supabase && window.supabase.createClient) {
                return window.supabase.createClient(SB_URL, SB_KEY);
            }
            return null;
        }
        
        let db = null;
        let currentUser = null;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        async function init() {
            db = getSB();
            if (!db) {
                showToast('Ошибка: Supabase не загружен');
                console.error('Supabase SDK not loaded');
                return;
            }
            
            const { data: { session }, error } = await db.auth.getSession();
            if (error) {
                console.error('getSession error:', error);
                showToast('Ошибка авторизации');
                return;
            }
            if (!session) { 
                window.location.href = '/login.html'; 
                return; 
            }
            currentUser = session.user;
            console.log('User loaded:', currentUser.email);
            renderProfile();
            loadTab('history');
        }

        function renderProfile() {
            if (!currentUser) return;
            const name = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email;
            const picture = currentUser.user_metadata?.avatar_url || currentUser.user_metadata?.picture;
            document.getElementById('profileName').textContent = name;
            document.getElementById('profileEmail').textContent = currentUser.email || '';
            const avatarEl = document.getElementById('avatar');
            if (picture) { avatarEl.innerHTML = '<img src="' + picture + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover">'; }
            else { avatarEl.textContent = name.charAt(0).toUpperCase(); }
            loadStats();
        }

        async function loadStats() {
            if (!currentUser || !db) return;
            try {
                const { count: c } = await db.from('user_history').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id);
                const { count: p } = await db.from('user_projects').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id);
                document.getElementById('statCalcs').textContent = c || 0;
                document.getElementById('statProjects').textContent = p || 0;
            } catch (e) { console.error('loadStats error:', e); showToast('Ошибка загрузки статистики'); }
        }

        document.querySelectorAll('.menu a[data-tab]').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                const tab = a.dataset.tab;
                if (tab === 'logout') { 
                    if (db) db.auth.signOut(); 
                    localStorage.clear(); 
                    window.location.href = '/'; 
                    return; 
                }
                document.querySelectorAll('.menu a').forEach(x => x.classList.remove('active'));
                a.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(x => x.style.display = 'none');
                document.getElementById('tab-' + tab).style.display = 'block';
                loadTab(tab);
            });
        });

        async function loadTab(tab) {
            if (tab === 'history') await loadHistory();
            if (tab === 'projects') await loadProjects();
        }

        async function loadHistory() {
            if (!currentUser || !db) return;
            try {
                const { data, error } = await db.from('user_history').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
                if (error) throw error;
                const list = document.getElementById('historyList');
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">Нет расчётов</div><a href="/" class="btn btn-primary">Сделать расчёт</a></div>';
                    return;
                }
                list.innerHTML = data.map(h => '<div class="card"><div class="card-header"><div class="card-title">' + esc(h.product_title || '—') + '</div><div class="card-date">' + new Date(h.created_at).toLocaleDateString('ru') + '</div></div><div class="card-meta"><span>📦 ' + esc(h.functional_unit || '—') + '</span><span>🌱 ' + (h.total_co2eq || 0) + ' kgCO₂e</span></div><div class="card-actions"><a href="/?history=' + h.id + '" class="btn btn-primary">Посмотреть</a><button class="btn btn-danger" onclick="deleteHistory(\'' + h.id + '\')">Удалить</button></div></div>').join('');
            } catch (e) { 
                console.error('loadHistory error:', e); 
                showToast('Ошибка загрузки истории: ' + (e.message || e)); 
            }
        }

        async function deleteHistory(id) {
            if (!confirm('Удалить расчёт?')) return;
            try { 
                const { error } = await db.from('user_history').delete().eq('id', id); 
                if (error) throw error;
                loadHistory(); 
                loadStats(); 
                showToast('Удалено'); 
            } catch (e) { 
                showToast('Ошибка удаления: ' + (e.message || e)); 
            }
        }

        async function loadProjects() {
            if (!currentUser || !db) return;
            try {
                const { data, error } = await db.from('user_projects').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
                if (error) throw error;
                const list = document.getElementById('projectsList');
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty"><div class="empty-icon">📁</div><div class="empty-text">Нет проектов</div><button class="btn btn-primary" onclick="createProject()">Создать</button></div>';
                    return;
                }
                list.innerHTML = data.map(p => '<div class="card"><div class="card-header"><div class="card-title">' + esc(p.name) + '</div><div class="card-date">' + new Date(p.created_at).toLocaleDateString('ru') + '</div></div><div class="card-actions"><a href="/?project=' + p.id + '" class="btn btn-primary">Открыть</a><button class="btn btn-danger" onclick="deleteProject(\'' + p.id + '\')">Удалить</button></div></div>').join('');
            } catch (e) { 
                console.error('loadProjects error:', e); 
                showToast('Ошибка загрузки проектов: ' + (e.message || e)); 
            }
        }

        document.getElementById('newProjectBtn').addEventListener('click', createProject);

        async function createProject() {
            const name = prompt('Название проекта:');
            if (!name || !name.trim()) return;
            try { 
                const { error } = await db.from('user_projects').insert({ user_id: currentUser.id, name: name.trim() }); 
                if (error) throw error;
                loadProjects(); 
                loadStats(); 
                showToast('Проект создан'); 
            } catch (e) { 
                showToast('Ошибка создания: ' + (e.message || e)); 
            }
        }

        async function deleteProject(id) {
            if (!confirm('Удалить проект?')) return;
            try { 
                const { error: e1 } = await db.from('project_calculations').delete().eq('project_id', id); 
                const { error: e2 } = await db.from('user_projects').delete().eq('id', id); 
                if (e1 || e2) throw (e1 || e2);
                loadProjects(); 
                loadStats(); 
                showToast('Удалено'); 
            } catch (e) { 
                showToast('Ошибка удаления: ' + (e.message || e)); 
            }
        }

        document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
            if (!confirm('Удалить аккаунт и все данные?')) return;
            try {
                await db.from('user_history').delete().eq('user_id', currentUser.id);
                await db.from('project_calculations').delete().eq('user_id', currentUser.id);
                await db.from('user_projects').delete().eq('user_id', currentUser.id);
                await db.auth.signOut();
                localStorage.clear();
                window.location.href = '/';
            } catch (e) { showToast('Ошибка: ' + (e.message || e)); }
        });

        document.getElementById('langSelect').value = localStorage.getItem('lca-lang') || 'ru';
        document.getElementById('langSelect').addEventListener('change', e => { localStorage.setItem('lca-lang', e.target.value); showToast('Язык сохранён'); });

        function syncThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
            const dt = document.getElementById('darkToggle');
            if (isDark) dt.classList.add('active'); else dt.classList.remove('active');
        }
        const headerToggle = document.getElementById('themeToggle');
        headerToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('lca-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            syncThemeUI();
        });
        const settingsToggle = document.getElementById('darkToggle');
        settingsToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('lca-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            syncThemeUI();
        });
        syncThemeUI();

        init();
    </script>
</body>
</html>
