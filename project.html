    <style>
        :root {
            --paper: #F2F0EC; --paper-sunk: #E9E6E0; --paper-raised: #F8F7F4;
            --graphite: #1C1B19; --graphite-mid: #6B6862; --graphite-low: #67635C;
            --rule: #D6D2CB;
            --e-2: #D4A574; --e-3: #D9481C; --e-4: #F03B0C; --e-5: #F03B0C; --e-ink: #7A2E10;
            --bg: var(--paper); --bg-soft: var(--paper-sunk); --bg-card: var(--paper-raised);
            --ink: var(--graphite); --ink-soft: var(--graphite-mid); --ink-mute: var(--graphite-low);
            --jade: var(--e-3);
            --sans: 'Source Serif 4', 'Noto Sans SC', Georgia, serif; --mono: 'JetBrains Mono', monospace;
            --display: 'Oswald', 'Noto Sans SC', system-ui, sans-serif;
            --transition: all .14s cubic-bezier(.22,1,.36,1);
        }
        html.dark {
            --paper: #131211; --paper-sunk: #0D0C0B; --paper-raised: #1B1A18;
            --graphite: #EDEAE4; --graphite-mid: #9B978F; --graphite-low: #8D8981;
            --rule: #2E2C29;
            --e-3: #F05A23; --e-4: #FF6B2C; --e-ink: #FF8A50;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); background: var(--bg); color: var(--ink); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 0; border-bottom: 1px solid var(--rule);
            background: color-mix(in srgb, var(--bg) 85%, transparent); position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: var(--ink); text-decoration: none; font-family: var(--display); }
        .brand em { font-style: normal; color: var(--jade); font-weight: 800; }
        .brand .dot { width: 8px; height: 8px; background: var(--jade); display: inline-block; }
        .nav { display: flex; gap: 20px; align-items: center; }
        .nav a { color: var(--graphite-low); text-decoration: none; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 0; font-family: var(--mono); }
        .nav a:hover { color: var(--graphite); }
        .nav a.active { color: var(--graphite); font-weight: 600; }
        .theme-toggle { background: none; border: 1px solid var(--rule); width: 30px; height: 30px; cursor: pointer; font-size: 0; display: inline-flex; align-items: center; justify-content: center; }
        .theme-toggle::after { content: ''; width: 12px; height: 12px; border: 1px solid var(--graphite); background: linear-gradient(90deg, var(--graphite) 50%, transparent 50%); }
        .lang { display: inline-flex; border: 1px solid var(--rule); overflow: hidden; }
        .lang button { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; padding: 5px 10px; border: none; background: transparent; color: var(--graphite-low); cursor: pointer; border-right: 1px solid var(--rule); }
        .lang button:last-child { border-right: none; }
        .lang button.active { background: var(--graphite); color: var(--paper); }

        .topbar {
            display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap;
            padding: 28px 0 18px; border-bottom: 1px solid var(--rule);
        }
        .topbar h1 { font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: 0.01em; }
        .topbar .sub { font-size: 13px; color: var(--ink-mute); margin-top: 6px; font-family: var(--mono); }
        .topbar .sub b { color: var(--ink-soft); font-weight: 600; }
        .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        select.settings-input {
            font-family: var(--mono); font-size: 13px; padding: 7px 10px;
            background: var(--bg-card); color: var(--ink); border: 1px solid var(--rule); cursor: pointer;
        }
        .btn { font-family: var(--mono); font-size: 12px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--rule); background: transparent; color: var(--ink-soft); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { border-color: var(--graphite); color: var(--graphite); }
        .btn-primary { background: var(--graphite); color: var(--paper); border-color: var(--graphite); }
        .btn-primary:hover { color: var(--paper); opacity: .85; }
        .btn-danger { color: var(--e-4); border-color: var(--e-4); }
        .btn-danger:hover { color: var(--e-4); background: color-mix(in srgb, var(--e-4) 8%, transparent); }
        .btn-sm { font-size: 11px; padding: 5px 9px; }

        .pv-layout { display: grid; grid-template-columns: 300px 1fr; gap: 28px; padding: 24px 0 60px; }
        @media (max-width: 900px) { .pv-layout { grid-template-columns: 1fr; } .pv-side { position: static !important; max-height: none !important; } }

        .pv-side { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 100px); overflow-y: auto; }
        .pv-search {
            width: 100%; font-family: var(--mono); font-size: 12px; padding: 8px 10px;
            background: var(--bg-card); border: 1px solid var(--rule); color: var(--ink); margin-bottom: 12px;
        }
        .pv-search:focus { outline: none; border-color: var(--graphite-mid); }
        .grp { border-bottom: 1px solid var(--rule); }
        .grp-head {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            padding: 9px 4px; background: none; border: none; cursor: pointer;
            font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--ink-soft); text-align: left;
        }
        .grp-head:hover { color: var(--graphite); }
        .grp-head .cnt { color: var(--ink-mute); }
        .grp-head .arr { transition: transform .12s ease; display: inline-block; }
        .grp.open .grp-head .arr { transform: rotate(90deg); }
        .grp-body { display: none; padding: 0 0 8px; }
        .grp.open .grp-body { display: block; }
        .ent {
            display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
            padding: 5px 8px 5px 18px; font-size: 13px; color: var(--ink-soft);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--sans);
        }
        .ent:hover { background: var(--bg-soft); color: var(--graphite); }
        .ent.sel { background: var(--graphite); color: var(--paper); }

        .pv-main { min-width: 0; }
        .card { background: var(--bg-card); border: 1px solid var(--rule); padding: 24px; margin-bottom: 18px; }
        .card h2 { font-family: var(--display); font-size: 20px; font-weight: 600; margin-bottom: 4px; word-break: break-word; }
        .card .path { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); margin-bottom: 16px; word-break: break-all; }
        .badge { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--rule); color: var(--ink-soft); margin-left: 8px; vertical-align: middle; text-decoration: none; }
        .badge.hot { border-color: var(--jade); color: var(--jade); }
        .badge.cloud { border-color: var(--graphite-mid); color: var(--graphite-mid); cursor: pointer; }
        table.kv { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.kv td { padding: 6px 8px; border-top: 1px solid var(--rule); vertical-align: top; }
        table.kv td.k { width: 220px; color: var(--ink-mute); font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
        table.ex { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
        table.ex th {
            text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--ink-mute); padding: 6px 8px; border-bottom: 1px solid var(--rule); font-weight: 500;
        }
        table.ex td { padding: 6px 8px; border-top: 1px solid var(--rule); vertical-align: top; }
        table.ex td.num { font-family: var(--mono); font-size: 12px; text-align: right; white-space: nowrap; }
        td.io-in { color: var(--ink-mute); }
        td.io-out { color: var(--jade); font-weight: 600; }
        a.ref { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--graphite-low); cursor: pointer; }
        a.ref:hover { color: var(--jade); border-bottom-color: var(--jade); }
        .sect { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 18px 0 6px; }
        .desc { font-size: 14px; line-height: 1.6; color: var(--ink-soft); white-space: pre-wrap; margin-top: 8px; }
        .empty { padding: 60px 20px; text-align: center; color: var(--ink-mute); font-size: 14px; }
        .more-btn { margin-top: 8px; font-family: var(--mono); font-size: 11px; background: none; border: 1px solid var(--rule); color: var(--ink-soft); padding: 5px 10px; cursor: pointer; }
        .more-btn:hover { border-color: var(--graphite); color: var(--graphite); }

        /* ── project list / cards ── */
        .plist { padding: 24px 0 60px; display: flex; flex-direction: column; gap: 16px; }
        .fbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 0 0; }
        .fchip { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; padding: 6px 12px; border: 1px solid var(--rule); background: transparent; color: var(--ink-soft); cursor: pointer; }
        .fchip:hover { border-color: var(--graphite); color: var(--graphite); }
        .fchip.active { background: var(--graphite); color: var(--paper); border-color: var(--graphite); }
        .fchip .cnt { opacity: .6; margin-left: 6px; }
        .fchip-act { font-family: var(--mono); font-size: 10px; padding: 6px 8px; border: 1px solid var(--rule); background: transparent; color: var(--ink-mute); cursor: pointer; }
        .fchip-act:hover { color: var(--e-4); border-color: var(--e-4); }
        .pcard { background: var(--bg-card); border: 1px solid var(--rule); padding: 20px 24px; }
        .pcard-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .pcard-title { font-family: var(--display); font-size: 18px; font-weight: 600; flex: 1; min-width: 200px; word-break: break-word; }
        .pcard-date { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); }
        .calc-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--rule); font-size: 13px; }
        .calc-item:first-child { border-top: none; }
        .calc-name { color: var(--ink); }
        .calc-name:hover { color: var(--jade); }
        .calc-date { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); }
        .calc-total { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule); }
        .target { margin-top: 14px; }
        .target-head { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; }
        .target-stat { color: var(--jade); font-weight: 700; }
        .target-stat.reached { color: var(--e-2); }
        .target-bar { height: 6px; background: var(--bg-soft); border: 1px solid var(--rule); }
        .target-fill { height: 100%; background: var(--jade); }
        .target-fill.reached { background: var(--e-2); }
        .target-foot { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); margin-top: 6px; }

        /* ── modals ── */
        .modal-mask { position: fixed; inset: 0; background: color-mix(in srgb, var(--graphite) 45%, transparent); display: none; align-items: center; justify-content: center; z-index: 400; padding: 20px; }
        .modal-mask.show, .modal-mask[style*="flex"] { display: flex; }
        .modal { background: var(--bg-card); border: 1px solid var(--rule); padding: 28px; width: 100%; max-width: 460px; }
        .modal h3 { font-family: var(--display); font-size: 18px; font-weight: 600; margin-bottom: 10px; }
        .modal p { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 12px; }
        .modal input, .modal select { width: 100%; font-family: var(--mono); font-size: 13px; padding: 9px 10px; background: var(--bg); border: 1px solid var(--rule); color: var(--ink); margin-bottom: 10px; }
        .modal input:focus, .modal select:focus { outline: none; border-color: var(--graphite-mid); }
        .modal label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mute); margin: 10px 0 4px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .share-role-note { font-size: 12px; color: var(--ink-mute); line-height: 1.4; margin: -4px 0 8px; }
        .share-link-row { display: flex; gap: 8px; }
        .share-link-row input { flex: 1; margin-bottom: 0; }

        #toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--graphite); color: var(--paper); font-size: 13px; padding: 10px 18px;
            opacity: 0; pointer-events: none; transition: var(--transition); z-index: 500; font-family: var(--mono);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media print {
            header, .pv-side, #expBar, #projActions, #toast, .modal-mask, .card-actions { display: none !important; }
            .pv-layout { grid-template-columns: 1fr !important; gap: 0 !important; }
            body { background: #fff; }
            .card { border-color: #bbb; break-inside: avoid; }
            .container { max-width: none; }
        }
    </style>

    let pvLang = 'ru';
    function t(k) { return (PV_I18N[pvLang] && PV_I18N[pvLang][k]) || PV_I18N.ru[k] || k; }
    function applyLang(lang) {
        pvLang = lang;
        document.title = t('title');
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
        document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
        renderTree();
        if (state.sel) selectEntity(state.sel.type, state.sel.id, true);
        renderMeta();
    }

    /* ── theme ── */
    function syncThemeUI() {
        const dt = document.getElementById('themeToggle');
        if (document.documentElement.classList.contains('dark')) dt.classList.add('active'); else dt.classList.remove('active');
    }
    document.getElementById('themeToggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('lca-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        syncThemeUI();
    });
    syncThemeUI();

    /* ── helpers ── */
    function esc(s) { const d = document.createElement('div'); d.textContent = (s === null || s === undefined) ? '' : String(s); return d.innerHTML; }
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg; el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 3000);
    }
    function fmtDate(iso) {
        return new Date(iso).toLocaleDateString(pvLang === 'zh' ? 'zh-CN' : pvLang, { year: 'numeric', month: 'short', day: 'numeric' });
    }
    function fmtCo2(v) {
        const n = parseFloat(v) || 0;
        if (n >= 1000) return (n / 1000).toFixed(2) + ' t';
        if (n >= 100) return n.toFixed(0);
        if (n >= 1) return n.toFixed(2);
        return n.toFixed(3);
    }
    function fmtNum(v) {
        const n = parseFloat(v);
        if (isNaN(n)) return String(v ?? '');
        if (n !== 0 && (Math.abs(n) < 0.001 || Math.abs(n) >= 100000)) return n.toExponential(3);
        return String(Math.round(n * 100000) / 100000);
    }
    const refId = r => r && typeof r === 'object' ? (r['@id'] || r.id || null) : null;
    const refName = r => (r && typeof r === 'object' && (r.name || r['@id'])) || (typeof r === 'string' ? r : null);
    const catPath = c => refName(c) ? String(refName(c)) : null;

    /* ── state ── */
    const GROUPS = [
        { key: 'Process', i18n: 'g_processes' },
        { key: 'Flow', i18n: 'g_flows' },
        { key: 'ProductSystem', i18n: 'g_systems' },
        { key: 'ImpactMethod', i18n: 'g_methods' },
        { key: 'ImpactCategory', i18n: 'g_categories' },
        { key: 'Result', i18n: 'g_results' },
        { key: 'UnitGroup', i18n: 'g_units' },
        { key: 'FlowProperty', i18n: 'g_flowprops' },
        { key: 'Location', i18n: 'g_locations' },
        { key: 'Actor', i18n: 'g_actors' },
        { key: 'Source', i18n: 'g_sources' },
        { key: 'DQSystem', i18n: 'g_dq' },
        { key: 'Parameter', i18n: 'g_params' },
        { key: 'Currency', i18n: 'g_currency' },
        { key: 'SocialIndicator', i18n: 'g_social' },
    ];
    const state = {
        projectId: null, project: null,
        savedAt: null, stats: null,
        entities: {}, index: new Map(),
        sel: null, openGroups: new Set(['Process']),
        factorLimit: new Map(),
    };

    let db = null, currentUser = null;

    /* ══════════════════════════════════════════════════
       Universal modal
       ══════════════════════════════════════════════════ */
    async function logAudit(action, entity, entityId, details) {
        if (!currentUser || !db) return;
        try {
            await db.from('audit_log').insert({
                user_id: currentUser.id, action, entity_type: entity,
                entity_id: entityId || null, details: details ? JSON.stringify(details) : null
            });
        } catch (e) { /* silent */ }
    }

    /* ══════════════════════════════════════════════════
       Init
       ══════════════════════════════════════════════════ */
    async function init() {
        if (!(window.supabase && window.supabase.createClient)) { showToast(t('err_sb')); return; }
        db = window.sb || window.supabase.createClient(SB_URL, SB_KEY);
        const { data: { session } } = await db.auth.getSession();
        if (!session) { window.location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
        currentUser = session.user;
        const params = new URLSearchParams(location.search);
        state.projectId = params.get('id');
        if (!state.projectId) { window.location.href = '/cabinet.html'; return; }
        document.getElementById('detailView').style.display = 'block';
        await initDetail();
    }

    /* ══════════════════════════════════════════════════
       LIST MODE
       ══════════════════════════════════════════════════ */
    async function initDetail() {
        try {
            const { data: proj, error: pErr } = await db.from('user_projects').select('*').eq('id', state.projectId).single();
            if (pErr || !proj) throw new Error(t('err_not_found'));
            state.project = proj;
            renderMeta();
            await loadSnapshot();
        } catch (e) {
            console.error(e);
            document.getElementById('projName').textContent = t('err_not_found');
            document.getElementById('projMeta').textContent = String(e.message || e);
        }
    }

    async function loadSnapshot() {
        document.getElementById('detail').innerHTML = '<div class="empty">' + esc(t('loading')) + '</div>';
        const { data, error } = await db.from('project_snapshots')
            .select('entities, stats, created_at, note')
            .eq('project_id', state.projectId).order('version', { ascending: false }).limit(1).maybeSingle();
        if (error) { showToast(t('err_load') + error.message); return; }
        if (!data) {
            state.entities = {};
            state.index = new Map();
            renderTree();
            document.getElementById('detail').innerHTML = '<div class="empty">' + esc(t('empty_tree')) + '</div>';
            return;
        }
        state.entities = data.entities || {};
        state.stats = data.stats || null;
        state.savedAt = data.created_at;
        state.index = new Map();
        for (const [type, arr] of Object.entries(state.entities)) {
            if (!Array.isArray(arr)) continue;
            for (const e of arr) {
                const id = e && e['@id'];
                if (id) state.index.set(id, { type, entity: e });
            }
        }
        state.sel = null;
        state.factorLimit = new Map();
        renderMeta();
        renderTree();
        const firstProc = (state.entities.Process || [])[0];
        const firstAny = firstProc || Object.values(state.entities).find(a => Array.isArray(a) && a.length)?.[0];
        if (firstAny) selectEntity(firstAny['@type'] || typeOf(firstAny), firstAny['@id']);
        else document.getElementById('detail').innerHTML = '<div class="empty">' + esc(t('empty_tree')) + '</div>';
        history.replaceState(null, '', '?id=' + state.projectId);
    }

    function typeOf(e) {
        for (const [type, arr] of Object.entries(state.entities)) {
            if (Array.isArray(arr) && arr.includes(e)) return type;
        }
        return null;
    }

    function renderMeta() {
        document.getElementById('projName').textContent = state.project ? state.project.name : '…';
        const s = state.stats || {};
        const parts = [];
        if (s.total) parts.push(t('meta_entities') + ': <b>' + s.total + '</b>');
        if (s.sizeMb) parts.push(t('meta_size') + ': <b>' + s.sizeMb + ' MB</b>');
        if (s.db) parts.push(t('meta_db') + ': <b>' + esc(s.db) + '</b>');
        if (state.savedAt) parts.push(t('meta_saved') + ': <b>' + fmtDate(state.savedAt) + '</b>');
        document.getElementById('projMeta').innerHTML = parts.join(' · ');
    }

    /* ── tree ── */
    function renderTree() {
        const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
        const box = document.getElementById('tree');
        let html = '';
        for (const g of GROUPS) {
            let arr = state.entities[g.key] || [];
            if (q) arr = arr.filter(e => String(e.name || '').toLowerCase().includes(q));
            if (!arr.length) continue;
            const open = q ? true : state.openGroups.has(g.key);
            html += '<div class="grp' + (open ? ' open' : '') + '" data-grp="' + g.key + '">';
            html += '<button class="grp-head" data-toggle="' + g.key + '"><span><span class="arr">▸</span> ' + esc(t(g.i18n)) + '</span><span class="cnt">' + arr.length + '</span></button>';
            html += '<div class="grp-body">';
            for (const e of arr) {
                const selCls = state.sel && state.sel.id === e['@id'] ? ' sel' : '';
                html += '<button class="ent' + selCls + '" data-type="' + g.key + '" data-id="' + esc(e['@id']) + '" title="' + esc(e.name) + '">' + esc(e.name || e['@id']) + '</button>';
            }
            html += '</div></div>';
        }
        if (!html) html = '<div class="empty">' + esc(q ? t('no_selection') : t('empty_tree')) + '</div>';
        box.innerHTML = html;
    }
    document.getElementById('tree').addEventListener('click', e => {
        const tog = e.target.closest('[data-toggle]');
        if (tog) {
            const k = tog.dataset.toggle;
            if (state.openGroups.has(k)) state.openGroups.delete(k); else state.openGroups.add(k);
            renderTree();
            return;
        }
        const ent = e.target.closest('.ent');
        if (ent) selectEntity(ent.dataset.type, ent.dataset.id);
    });
    document.getElementById('searchInput').addEventListener('input', renderTree);

    /* ── detail rendering ── */
    function selectEntity(type, id, silent) {
        const hit = state.index.get(id);
        const e = hit ? hit.entity : null;
        if (!e) return;
        state.sel = { type: hit.type || type, id };
        if (!silent) {
            state.openGroups.add(state.sel.type);
            renderTree();
        } else {
            document.querySelectorAll('.ent').forEach(b => b.classList.toggle('sel', b.dataset.id === id));
        }
        const box = document.getElementById('detail');
        box.innerHTML = renderEntity(e, state.sel.type);
        box.querySelectorAll('a.ref[data-goto]').forEach(a => {
            a.addEventListener('click', ev => { ev.preventDefault(); selectEntity(null, a.dataset.goto); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        });
        box.querySelectorAll('button.more-btn').forEach(b => {
            b.addEventListener('click', () => {
                const k = b.dataset.key;
                state.factorLimit.set(k, (state.factorLimit.get(k) || 100) + 200);
                selectEntity(state.sel.type, state.sel.id, true);
            });
        });
    }

    function refLink(ref) {
        const id = refId(ref);
        const name = refName(ref) || id || t('none');
        if (id && state.index.has(id)) return '<a class="ref" href="#" data-goto="' + esc(id) + '">' + esc(name) + '</a>';
        return esc(name);
    }
    function kvRow(k, v) {
        if (v === null || v === undefined || v === '') return '';
        return '<tr><td class="k">' + esc(k) + '</td><td>' + v + '</td></tr>';
    }
    function metaBlock(e) {
        let r = '';
        r += kvRow(t('k_category'), esc(catPath(e.category) || ''));
        r += kvRow(t('k_location'), refName(e.location) ? esc(refName(e.location)) : '');
        r += kvRow(t('k_type'), e.processType || e.flowType || e.flowPropertyType || '');
        r += kvRow(t('k_version'), e.version ? esc(e.version) : '');
        r += kvRow(t('k_changed'), e.lastChange ? esc(String(e.lastChange).slice(0, 10)) : '');
        r += kvRow(t('k_cas'), e.cas ? esc(e.cas) : '');
        r += kvRow(t('k_refunit'), e.refUnit ? esc(e.refUnit) : '');
        r += kvRow(t('k_value'), (e.value !== undefined && typeof e.value !== 'object') ? esc(fmtNum(e.value)) : '');
        r += kvRow(t('k_code'), e.code ? esc(e.code) : '');
        r += kvRow(t('k_url'), e.url ? '<a class="ref" style="border:none;text-decoration:underline" href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.url) + '</a>' : '');
        r += kvRow(t('k_organisation'), e.organisation ? esc(e.organisation) : '');
        r += kvRow(t('k_unitgroup'), e.unitGroup ? refLink(e.unitGroup) : '');
        return r ? '<table class="kv">' + r + '</table>' : '';
    }
    function descBlock(e) {
        return e.description ? '<div class="desc">' + esc(e.description) + '</div>' : '';
    }
    function head(e, type) {
        return '<div class="card"><h2>' + esc(e.name || e['@id']) +
            '<span class="badge hot">' + esc(type) + '</span></h2>' +
            '<div class="path">' + esc(e['@id'] || '') + '</div>' + metaBlock(e) + descBlock(e) + '</div>';
    }

    function exRow(x) {
        const isIn = x.input === true || x.isInput === true;
        const amt = x.amountFormula ? esc(x.amountFormula) : fmtNum(x.amount);
        return '<tr>' +
            '<td class="' + (isIn ? 'io-in' : 'io-out') + '">' + esc(isIn ? t('in') : t('out')) + '</td>' +
            '<td>' + refLink(x.flow) + '</td>' +
            '<td class="num">' + amt + '</td>' +
            '<td>' + esc(refName(x.unit) || '') + '</td>' +
            '<td>' + (refId(x.defaultProvider) ? refLink(x.defaultProvider) : '<span style="color:var(--ink-mute)">' + esc(t('none')) + '</span>') + '</td>' +
            '<td class="num">' + (x.dqEntry ? esc(x.dqEntry) : '') + '</td>' +
            '</tr>';
    }
    function exTable(rows) {
        return '<table class="ex"><thead><tr>' +
            '<th>' + esc(t('c_io')) + '</th><th>' + esc(t('c_flow')) + '</th><th style="text-align:right">' + esc(t('c_amount')) + '</th>' +
            '<th>' + esc(t('c_unit')) + '</th><th>' + esc(t('c_provider')) + '</th><th>' + esc(t('c_dq')) + '</th>' +
            '</tr></thead><tbody>' + rows.map(exRow).join('') + '</tbody></table>';
    }

    function renderProcess(e) {
        let h = head(e, 'Process');
        const ex = Array.isArray(e.exchanges) ? e.exchanges : [];
        const ins = ex.filter(x => x.input === true || x.isInput === true);
        const outs = ex.filter(x => !(x.input === true || x.isInput === true));
        h += '<div class="card">';
        if (e.refFlow) h += '<div class="sect">' + esc(t('k_ref_flow')) + '</div><div>' + refLink(e.refFlow) + (e.unit ? ' · ' + esc(refName(e.unit)) : '') + (e.refQuantity ? ' · ' + fmtNum(e.refQuantity) : '') + '</div>';
        h += '<div class="sect">' + esc(t('s_outputs')) + ' (' + outs.length + ')</div>';
        h += outs.length ? exTable(outs) : '<div style="color:var(--ink-mute);font-size:13px">' + esc(t('none')) + '</div>';
        h += '<div class="sect">' + esc(t('s_inputs')) + ' (' + ins.length + ')</div>';
        h += ins.length ? exTable(ins) : '<div style="color:var(--ink-mute);font-size:13px">' + esc(t('none')) + '</div>';
        h += '</div>';
        return h;
    }

    function renderFlow(e) {
        let h = head(e, 'Flow');
        const fps = Array.isArray(e.flowProperties) ? e.flowProperties : [];
        if (fps.length) {
            h += '<div class="card"><div class="sect" style="margin-top:0">' + esc(t('s_flowprops')) + '</div>';
            h += '<table class="ex"><thead><tr><th>' + esc(t('c_prop')) + '</th><th style="text-align:right">' + esc(t('c_conv')) + '</th><th>' + esc(t('c_ref')) + '</th></tr></thead><tbody>';
            for (const fp of fps) {
                h += '<tr><td>' + refLink(fp.flowProperty) + '</td><td class="num">' + fmtNum(fp.conversionFactor) + '</td><td>' + (fp.isRefFlowProperty ? '★' : '') + '</td></tr>';
            }
            h += '</tbody></table></div>';
        }
        return h;
    }

    function renderImpactCategory(e) {
        let h = head(e, 'ImpactCategory');
        const fs = Array.isArray(e.impactFactors) ? e.impactFactors : [];
        const limit = state.factorLimit.get(e['@id']) || 100;
        h += '<div class="card"><div class="sect" style="margin-top:0">' + esc(t('s_factors')) + ' (' + fs.length + ')</div>';
        if (fs.length) {
            h += '<table class="ex"><thead><tr><th>' + esc(t('c_flow')) + '</th><th style="text-align:right">' + esc(t('c_factor')) + '</th><th>' + esc(t('c_unit')) + '</th></tr></thead><tbody>';
            for (const f of fs.slice(0, limit)) {
                h += '<tr><td>' + refLink(f.flow) + '</td><td class="num">' + fmtNum(f.value) + '</td><td>' + esc(refName(f.unit) || e.refUnit || '') + '</td></tr>';
            }
            h += '</tbody></table>';
            if (fs.length > limit) h += '<button class="more-btn" data-key="' + esc(e['@id']) + '">' + esc(t('more').replace('{n}', fs.length - limit)) + '</button>';
        } else h += '<div style="color:var(--ink-mute);font-size:13px">' + esc(t('none')) + '</div>';
        h += '</div>';
        return h;
    }

    function renderImpactMethod(e) {
        let h = head(e, 'ImpactMethod');
        const cats = Array.isArray(e.impactCategories) ? e.impactCategories : [];
        h += '<div class="card"><div class="sect" style="margin-top:0">' + esc(t('s_categories')) + ' (' + cats.length + ')</div>';
        h += cats.length ? '<table class="ex"><tbody>' + cats.map(c => '<tr><td>' + refLink(c) + '</td></tr>').join('') + '</tbody></table>'
            : '<div style="color:var(--ink-mute);font-size:13px">' + esc(t('none')) + '</div>';
        h += '</div>';
        return h;
    }

    function renderUnitGroup(e) {
        let h = head(e, 'UnitGroup');
        const us = Array.isArray(e.units) ? e.units : [];
        h += '<div class="card"><div class="sect" style="margin-top:0">' + esc(t('s_units')) + ' (' + us.length + ')</div>';
        if (us.length) {
            h += '<table class="ex"><thead><tr><th>Name</th><th style="text-align:right">' + esc(t('c_conv')) + '</th><th>' + esc(t('c_ref')) + '</th></tr></thead><tbody>';
            for (const u of us) h += '<tr><td>' + esc(u.name) + '</td><td class="num">' + fmtNum(u.conversionFactor) + '</td><td>' + (u.isRefUnit ? '★' : '') + '</td></tr>';
            h += '</tbody></table>';
        } else h += '<div style="color:var(--ink-mute);font-size:13px">' + esc(t('none')) + '</div>';
        h += '</div>';
        return h;
    }

    function renderProductSystem(e) {
        let h = head(e, 'ProductSystem');
        h += '<div class="card">';
        let r = '';
        r += kvRow(t('c_refprocess'), e.refProcess ? refLink(e.refProcess) : '');
        r += kvRow(t('c_target'), (e.targetAmount !== undefined ? fmtNum(e.targetAmount) : '') + (e.targetUnit ? ' ' + esc(refName(e.targetUnit)) : ''));
        if (r) h += '<table class="kv">' + r + '</table>';
        const procs = Array.isArray(e.processes) ? e.processes : [];
        h += '<div class="sect">' + esc(t('s_processes')) + ' (' + procs.length + ')</div>';
        h += procs.length ? '<table class="ex"><tbody>' + procs.map(p => '<tr><td>' + refLink(p) + '</td><td style="color:var(--ink-mute);font-size:12px">' + esc(p.location || '') + '</td></tr>').join('') + '</tbody></table>'
            : '<div style="color:var(--ink-mute);font-size:13px">' + esc(t('none')) + '</div>';
        const links = Array.isArray(e.processLinks) ? e.processLinks : [];
        if (links.length) h += '<div class="sect">' + esc(t('s_links')) + ': ' + links.length + '</div>';
        h += '</div>';
        return h;
    }

    function renderDQSystem(e) {
        let h = head(e, 'DQSystem');
        const inds = Array.isArray(e.indicators) ? e.indicators : [];
        h += '<div class="card"><div class="sect" style="margin-top:0">' + esc(t('s_indicators')) + ' (' + inds.length + ')</div>';
        for (const ind of inds) {
            h += '<div style="margin:12px 0 4px;font-size:13px;font-weight:600">' + esc(ind.name) + ' <span style="color:var(--ink-mute);font-family:var(--mono);font-size:11px">#' + esc(ind.position) + '</span></div>';
            const sc = Array.isArray(ind.scores) ? ind.scores : [];
            if (sc.length) {
                h += '<table class="ex"><thead><tr><th>' + esc(t('c_position')) + '</th><th>' + esc(t('c_label')) + '</th></tr></thead><tbody>';
                for (const s of sc) h += '<tr><td class="num">' + esc(s.position) + '</td><td>' + esc(s.label) + '</td></tr>';
                h += '</tbody></table>';
            }
        }
        if (!inds.length) h += '<div style="color:var(--ink-mute);font-size:13px">' + esc(t('none')) + '</div>';
        h += '</div>';
        return h;
    }

    function renderResult(e) {
        let h = head(e, 'Result');
        const setup = e.calculationSetup || {};
        h += '<div class="card"><div class="sect" style="margin-top:0">' + esc(t('s_setup')) + '</div><table class="kv">';
        h += kvRow('Product system', setup.productSystem ? refLink(setup.productSystem) : '');
        h += kvRow('Impact method', setup.impactMethod ? refLink(setup.impactMethod) : '');
        h += kvRow('Amount', setup.amount !== undefined ? fmtNum(setup.amount) : '');
        h += kvRow('Allocation', setup.allocation || '');
        h += '</table>';
        const ir = e.impactResults || e.impacts || [];
        if (Array.isArray(ir) && ir.length) {
            h += '<div class="sect">' + esc(t('s_results')) + ' (' + ir.length + ')</div>';
            h += '<table class="ex"><thead><tr><th>Category</th><th style="text-align:right">Value</th></tr></thead><tbody>';
            for (const r0 of ir.slice(0, 100)) {
                const cat = r0.impactCategory || r0.category || {};
                h += '<tr><td>' + refLink(cat) + '</td><td class="num">' + fmtNum(r0.amount !== undefined ? r0.amount : r0.value) + '</td></tr>';
            }
            h += '</tbody></table>';
        }
        h += '</div>';
        return h;
    }

    function renderGeneric(e, type) {
        let h = head(e, type);
        const skip = new Set(['@type', '@id', 'name', 'description', 'category', 'location', 'processType', 'flowType', 'flowPropertyType', 'version', 'lastChange', 'cas', 'refUnit', 'value', 'code', 'url', 'organisation', 'unitGroup']);
        let rows = '';
        let extra = '';
        for (const [k, v] of Object.entries(e)) {
            if (skip.has(k) || v === null || v === undefined) continue;
            if (typeof v === 'object' && !Array.isArray(v) && (refId(v) || v.name)) { rows += kvRow(k, refLink(v)); continue; }
            if (Array.isArray(v)) {
                if (v.length && v.every(x => x && typeof x === 'object' && (refId(x) || x.name))) {
                    extra += '<div class="sect">' + esc(k) + ' (' + v.length + ')</div><table class="ex"><tbody>' +
                        v.slice(0, 50).map(x => '<tr><td>' + (refId(x) ? refLink(x) : esc(x.name)) + '</td></tr>').join('') +
                        '</tbody></table>';
                } else if (v.length && typeof v[0] !== 'object') {
                    rows += kvRow(k, esc(v.join(', ')));
                } else {
                    rows += kvRow(k, '[' + v.length + ']');
                }
                continue;
            }
            if (typeof v === 'object') { rows += kvRow(k, esc(JSON.stringify(v).slice(0, 200))); continue; }
            rows += kvRow(k, esc(String(v)));
        }
        if (rows) h += '<div class="card"><div class="sect" style="margin-top:0">' + esc(t('s_other')) + '</div><table class="kv">' + rows + '</table>' + extra + '</div>';
        else if (extra) h += '<div class="card">' + extra + '</div>';
        return h;
    }

    function renderEntity(e, type) {
        switch (type) {
            case 'Process': return renderProcess(e);
            case 'Flow': return renderFlow(e);
            case 'ImpactCategory': return renderImpactCategory(e);
            case 'ImpactMethod': return renderImpactMethod(e);
            case 'UnitGroup': return renderUnitGroup(e);
            case 'ProductSystem': return renderProductSystem(e);
            case 'DQSystem': return renderDQSystem(e);
            case 'Result': return renderResult(e);
            default: return renderGeneric(e, type);
        }
    }

    /* ══════════════════════════════════════════════════
       Exports (Excel / Word / JSON / PDF / Print) — тот же набор, что в report.html
       ══════════════════════════════════════════════════ */
    const lazyLibs = {
        xlsx: { url: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', loaded: false },
        jspdf: { url: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', loaded: false },
        html2canvas: { url: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', loaded: false },
    };
    async function loadLib(name) {
        if (lazyLibs[name].loaded) return true;
        return new Promise((resolve) => {
            const s = document.createElement('script');
            s.src = lazyLibs[name].url;
            s.onload = () => { lazyLibs[name].loaded = true; resolve(true); };
            s.onerror = () => resolve(false);
            document.head.appendChild(s);
        });
    }
    const safeName = (s) => String(s || 'lca-project').replace(/[^\w\-Ѐ-ӿ一-鿿]+/g, '_').slice(0, 50);

    /* ── openLCA-style: one workbook per entity, packed into a zip ── */
    const EX_HEADERS = () => ['Flow', 'Category', 'Flow type', 'Unit', 'Amount', 'Formula', 'Uncertainty', 'Provider', 'DQ'];
    function metaPairs(e) {
        return [
            ['Name', e.name || ''],
            ['Category', catPath(e.category) || ''],
            ['Location', refName(e.location) || ''],
            ['Type', e.processType || e.flowType || e.flowPropertyType || e['@type'] || ''],
            ['CAS', e.cas || ''],
            ['Version', e.version || ''],
            ['Last change', e.lastChange ? String(e.lastChange).slice(0, 10) : ''],
            ['Reference unit', e.refUnit || ''],
            ['Reference flow', refName(e.refFlow) || ''],
            ['Reference quantity', e.refQuantity != null ? e.refQuantity : ''],
            ['Unit', refName(e.unit) || ''],
            ['Description', e.description || ''],
            ['ID', e['@id'] || ''],
        ];
    }
    function exRows(list) {
        return list.map(x => {
            const fl = x.flow || {};
            return [
                refName(x.flow) || '', String(fl.category || ''), String(fl.flowType || ''), refName(x.unit) || '',
                typeof x.amount === 'number' ? x.amount : (x.amount || ''), x.amountFormula || '',
                x.uncertainty ? JSON.stringify(x.uncertainty) : '', refName(x.defaultProvider) || '', x.dqEntry || '',
            ];
        });
    }
    function entityWorkbook(type, e) {
        const wb = XLSX.utils.book_new();
        const add = (rows, name, cols) => {
            const ws = XLSX.utils.aoa_to_sheet(rows);
            if (cols) ws['!cols'] = cols;
            XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
        };
        const W = [{ wch: 20 }, { wch: 60 }];
        const XC = [{ wch: 40 }, { wch: 24 }, { wch: 16 }, { wch: 10 }, { wch: 14 }, { wch: 14 }, { wch: 22 }, { wch: 32 }, { wch: 20 }];
        switch (type) {
            case 'Process': {
                add(metaPairs(e), 'Process', W);
                const ex = e.exchanges || [];
                add([EX_HEADERS(), ...exRows(ex.filter(x => x.input === true || x.isInput === true))], 'Inputs', XC);
                add([EX_HEADERS(), ...exRows(ex.filter(x => !(x.input === true || x.isInput === true)))], 'Outputs', XC);
                break;
            }
            case 'Flow': {
                add(metaPairs(e), 'Flow', W);
                add([['Flow property', 'Reference', 'Conversion factor'],
                    ...(e.flowProperties || []).map(fp => [refName(fp.flowProperty) || '', fp.isRefFlowProperty ? 'yes' : '', fp.conversionFactor != null ? fp.conversionFactor : ''])],
                    'Flow properties', [{ wch: 32 }, { wch: 10 }, { wch: 18 }]);
                break;
            }
            case 'ImpactCategory': {
                add(metaPairs(e), 'Impact category', W);
                add([['Flow', 'Category', 'Flow type', 'Unit', 'Value', 'Formula'],
                    ...(e.impactFactors || []).map(f => [refName(f.flow) || '', String((f.flow && f.flow.category) || ''), String((f.flow && f.flow.flowType) || ''), refName(f.unit) || e.refUnit || '', f.value != null ? f.value : '', f.formula || ''])],
                    'Factors', [{ wch: 40 }, { wch: 24 }, { wch: 16 }, { wch: 12 }, { wch: 16 }, { wch: 16 }]);
                break;
            }
            case 'ImpactMethod': {
                add(metaPairs(e), 'Impact method', W);
                add([['Impact category'], ...(e.impactCategories || []).map(c => [refName(c) || ''])], 'Categories', [{ wch: 48 }]);
                break;
            }
            case 'UnitGroup': {
                add(metaPairs(e), 'Unit group', W);
                add([['Unit', 'Conversion factor', 'Reference unit'],
                    ...(e.units || []).map(u => [u.name || '', u.conversionFactor != null ? u.conversionFactor : '', u.isRefUnit ? 'yes' : ''])],
                    'Units', [{ wch: 20 }, { wch: 18 }, { wch: 14 }]);
                break;
            }
            case 'ProductSystem': {
                add(metaPairs(e), 'Product system', W);
                add([['Process', 'Category', 'Location', 'Type'],
                    ...(e.processes || []).map(p => [refName(p) || '', String(p.category || ''), String(p.location || ''), String(p.processType || '')])],
                    'Processes', [{ wch: 44 }, { wch: 24 }, { wch: 10 }, { wch: 16 }]);
                add([['Provider', 'Process', 'Amount', 'Unit'],
                    ...(e.processLinks || []).map(l => [refName(l.provider) || '', refName(l.process) || '', l.amount != null ? l.amount : '', refName(l.unit) || ''])],
                    'Process links', [{ wch: 40 }, { wch: 40 }, { wch: 14 }, { wch: 10 }]);
                break;
            }
            case 'DQSystem': {
                add(metaPairs(e), 'DQ system', W);
                const rows = [['Indicator', 'Indicator #', 'Score #', 'Label']];
                for (const ind of (e.indicators || [])) {
                    for (const s of (ind.scores || [])) rows.push([ind.name || '', ind.position != null ? ind.position : '', s.position != null ? s.position : '', s.label || '']);
                }
                add(rows, 'Indicators', [{ wch: 32 }, { wch: 10 }, { wch: 8 }, { wch: 48 }]);
                break;
            }
            default:
                add(metaPairs(e), type.slice(0, 31), W);
        }
        return wb;
    }

        if (state.aiReport) return state.aiReport;
        const { data: { session } } = await db.auth.getSession();

        const res = await fetch(SB_URL + '/functions/v1/lca-proxy', {

            body: JSON.stringify({

                max_tokens: 8000,
                temperature: 0.3,
                response_format: { type: 'json_object' },
                messages: [
                    { role: 'system', content: AI_SYSTEM },
                    { role: 'user', content: JSON.stringify(aiPayload()) },

        if (!res.ok) throw new Error('AI HTTP ' + res.status);

    const AI_SYSTEM_REPORT = [
        'You are a senior LCA consultant writing the narrative sections of a technical report for a life cycle study.',
        'You receive JSON with: the chosen impact category and method, computed stage results (screening LCIA over direct elementary flows), an inventory summary and database metadata.',
        'All numbers in the input were computed from the database; you must not invent any additional numbers. You may reference the provided values and derived shares.',
        'Return ONLY a JSON object with keys: "analysis" (string, 1-2 paragraphs interpreting the stage results and hotspots), "assumptions" (array of strings), "limitations" (array of strings), "recommendations" (array of strings).',
        'Explicitly state in limitations that stage values are a screening estimate based on direct elementary flows of each process multiplied by the category characterization factors, without full supply-chain recursion, unless a saved calculation result was provided.',
        'Write in the language of the "lang" field (ru, en or zh) using professional LCA terminology.',
    ].join(' ');

    function chooseCategory() {
        const cats = state.entities.ImpactCategory || [];
        if (!cats.length) return null;
        return cats.find(c => /climate|global warming|co2|парник|климат/i.test(c.name || '')) || cats[0];
    }

    function screening(cat) {
        const factors = new Map();
        for (const f of (cat.impactFactors || [])) {
            const id = refId(f.flow);
            if (id) factors.set(id, parseFloat(f.value) || 0);
        }
        const flows = new Map();
        for (const fl of (state.entities.Flow || [])) flows.set(fl['@id'], fl);
        const groups = new Map();
        for (const p of (state.entities.Process || [])) {
            let v = 0;
            for (const x of (p.exchanges || [])) {
                const fid = refId(x.flow);
                if (!fid || !factors.has(fid)) continue;
                const fl = flows.get(fid);
                if (!fl || String(fl.flowType || '') !== 'ELEMENTARY_FLOW') continue;
                const amt = parseFloat(x.amount);
                if (!isNaN(amt)) v += amt * factors.get(fid);
            }
            const path = String(catPath(p.category) || '').split('/')[0].trim() || t('rep_stage_other');
            const g = groups.get(path) || { name: path, co2eq: 0, sub_processes: [] };
            const rq = parseFloat(p.refQuantity) || 0;
            g.co2eq += v;
            g.sub_processes.push({
                name: p.name || '', amount: rq, unit: refName(p.unit) || '',
                factor: rq ? v / rq : v, factor_source: t('rep_factor_source'), co2eq: v,
            });
            groups.set(path, g);
        }
        const stages = [...groups.values()].filter(g => Math.abs(g.co2eq) > 1e-12);
        const sum = stages.reduce((a, g) => a + g.co2eq, 0);
        for (const g of stages) g.share_pct = sum ? Math.round((g.co2eq / sum) * 1000) / 10 : 0;
        stages.sort((a, b) => b.co2eq - a.co2eq);
        let resultsTotal = null;
        for (const r of (state.entities.Result || [])) {
            const ir = r.impactResults || r.impacts || [];
            for (const row of ir) {
                const c = row.impactCategory || row.category || {};
                if ((refId(c) === cat['@id'] || (refName(c) || '') === (cat.name || '')) && row.amount != null) {
                    resultsTotal = parseFloat(row.amount) || 0;
                }
            }
        }
        return { stages, sum, resultsTotal };
    }

    function functionalUnit() {
        const ps = (state.entities.ProductSystem || [])[0];
        if (ps && ps.targetAmount != null) return fmtNum(ps.targetAmount) + ' ' + (refName(ps.targetUnit) || '');
        const p = (state.entities.Process || [])[0];
        if (p && p.refQuantity != null) return fmtNum(p.refQuantity) + ' ' + (refName(p.unit) || '') + ' (' + (refName(p.refFlow) || '') + ')';
        return '—';
    }

    async function generateReport() {
        const cat = chooseCategory();
        if (!cat) { showToast(t('err_no_cat')); return; }
        showToast(t('ai_generating'));
        const { stages, sum, resultsTotal } = screening(cat);
        const method = ((state.entities.ImpactMethod || [])[0] || {}).name || '—';
        const locs = {};
        for (const p of (state.entities.Process || [])) { const l = refName(p.location); if (l) locs[l] = (locs[l] || 0) + 1; }
        const region = Object.keys(locs).sort((a, b) => locs[b] - locs[a])[0] || '—';
        const limits = [t('rep_note_screening').replace('{cat}', cat.name || '').replace('{method}', method)];
        if (resultsTotal !== null) limits.push(t('rep_note_results').replace('{v}', fmtNum(resultsTotal)));
        let ai = { analysis: '', assumptions: [], limitations: [], recommendations: [] };
        try {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                const payload = {
                    lang: pvLang, method, impact_category: cat.name, ref_unit: cat.refUnit || '',
                    functional_unit: functionalUnit(), region,
                    total_screening: sum, saved_result: resultsTotal,
                    stages: stages.map(g => ({ name: g.name, value: g.co2eq, share_pct: g.share_pct, processes: g.sub_processes.map(x => x.name) })),
                    db: (state.stats || {}).db || '', entities: (state.stats || {}).total || 0,
                };
                const res = await fetch(SB_URL + '/functions/v1/lca-proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
                    body: JSON.stringify({
                        model: 'deepseek-chat', max_tokens: 4000, temperature: 0.3,
                        response_format: { type: 'json_object' },
                        messages: [{ role: 'system', content: AI_SYSTEM_REPORT }, { role: 'user', content: JSON.stringify(payload) }],
                    }),
                });
                if (res.ok) {
                    const out = await res.json();
                    const txt = out && out.choices && out.choices[0] && out.choices[0].message && out.choices[0].message.content;
                    if (txt) ai = Object.assign(ai, JSON.parse(txt));
                }
            }
        } catch (e) { console.warn('AI narrative failed:', e); }
        const rd = {
            source: 'db',
            product_title: (state.project ? state.project.name : 'DB') + ' — ' + t('gen_report_short'),
            functional_unit: functionalUnit(),
            system_boundary: t('rep_boundary'),
            method: method + ' / ' + (cat.name || ''),
            region,
            total_co2eq: resultsTotal !== null ? resultsTotal : sum,
            total_description: ai.analysis || '',
            stages,
            assumptions: ai.assumptions || [],
            limitations: (ai.limitations || []).concat(limits),
            recommendations: ai.recommendations || [],
            db_name: (state.stats || {}).db || '',
        };
        try {
            const { data: hist, error } = await db.from('user_history')
                .insert({ user_id: currentUser.id, product_title: rd.product_title, total_co2eq: rd.total_co2eq, report_data: rd })
                .select().single();
            if (error) throw error;
            await db.from('project_calculations').insert({ project_id: state.projectId, user_id: currentUser.id, report_data: rd, total_co2eq: rd.total_co2eq });
            logAudit('create', 'report', hist.id, { source: 'db' });
            showToast(t('rep_saved'));
            window.location.href = '/report.html?history=' + hist.id;
        } catch (e) { showToast(t('err_generic') + String(e.message || e)); }
    }
    document.getElementById('genReportBtn').addEventListener('click', generateReport);

    /* ── lang init ── */
    (function () {
        const saved = localStorage.getItem('lca-lang');
        const bl = (navigator.language || '').toLowerCase();
        pvLang = saved || (bl.indexOf('zh') === 0 ? 'zh' : bl.indexOf('en') === 0 ? 'en' : 'ru');
        document.querySelectorAll('.lang button').forEach(b => {
            b.classList.toggle('active', b.dataset.lang === pvLang);
            b.addEventListener('click', () => { localStorage.setItem('lca-lang', b.dataset.lang); applyLang(b.dataset.lang); });
        });
        document.title = t('title');
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    })();

    (function waitSDK(tries) {
        if (window.supabase && window.supabase.createClient) { init(); return; }
        if (tries > 150) { showToast(t('err_sb')); return; }
        setTimeout(() => waitSDK(tries + 1), 200);
    })(0);
</script>
</body>
</html>
